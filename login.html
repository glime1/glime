<style>
:root{
  --bg-dark:#0a0f16;
  --card-bg:#111827;
  --neon-green:#00ff88;
  --cyan-blue:#00f0ff;
  --text-main:#fff;
  --text-muted:#9ca3af;
  --danger:#ff4757;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins,sans-serif;
}

body{
  background:var(--bg-dark);
  color:var(--text-main);

  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow-x:hidden;
  padding:20px;

body:before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  background:rgba(0,240,255,.05);
  border-radius:50%;
  filter:blur(100px);
  top:10%;
  left:50%;
  transform:translateX(-50%);
  pointer-events:none;
}

.login-box{
  background:var(--card-bg);
  padding:40px;
  border-radius:20px;
  box-shadow:
    0 15px 40px rgba(0,0,0,.4),
    0 0 40px rgba(0,240,255,.03);
  border:1px solid rgba(255,255,255,.05);
  width:100%;
  max-width:430px;
  text-align:center;
  z-index:10;
}

.login-box h2{
  font-size:2rem;
  margin-bottom:10px;
  background:
    linear-gradient(
      90deg,
      var(--neon-green),
      var(--cyan-blue)
    );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.login-box>p{
  color:var(--text-muted);
  font-size:.9rem;
  margin-bottom:30px;
}

.logo-mark{
  width:72px;
  height:72px;
  margin:0 auto 18px;
  display:block;
}

.form-group{
  margin-bottom:20px;
  text-align:left;
}

.form-group label{
  display:block;
  margin-bottom:8px;
  color:var(--text-muted);
  font-size:.85rem;
  font-weight:600;
}

input{
  width:100%;
  padding:12px 15px;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.1);
  border-radius:8px;
  color:#fff;
  font-size:1rem;
  outline:none;
  transition:.3s;
}

input::placeholder{
  color:#6b7280;
}

input:focus{
  border-color:var(--cyan-blue);
  background:rgba(255,255,255,.05);
  box-shadow:0 0 15px rgba(0,240,255,.08);
}

.btn-primary{
  width:100%;
  background:
    linear-gradient(
      90deg,
      var(--neon-green),
      var(--cyan-blue)
    );
  color:#000;
  padding:12px;
  border-radius:8px;
  font-weight:700;
  font-size:1.05rem;
  cursor:pointer;
  border:none;
  margin-top:10px;
  transition:.3s;
}

.btn-primary:hover{
  box-shadow:0 0 15px rgba(0,240,255,.4);
  transform:translateY(-2px);
}

.btn-primary:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}

.secondary-link{
  display:block;
  margin-top:16px;
  color:var(--cyan-blue);
  text-decoration:none;
  font-size:.88rem;
  cursor:pointer;
}

.secondary-link:hover{
  color:var(--neon-green);
}

.back-link{
  display:block;
  margin-top:20px;
  color:var(--text-muted);
  text-decoration:none;
  font-size:.85rem;
}

.back-link:hover{
  color:var(--neon-green);
}

#error-message{
  color:var(--danger);
  font-size:.85rem;
  margin-top:15px;
  display:none;
  line-height:1.5;
}

#success-message{
  color:var(--neon-green);
  font-size:.85rem;
  margin-top:15px;
  display:none;
  line-height:1.5;
}

.hidden{
  display:none!important;
}

.whatsapp-float{
  position:fixed;
  bottom:30px;
  right:30px;
  background:#25d366;
  color:#fff;
  border-radius:50%;
  box-shadow:2px 2px 10px rgba(0,0,0,.3);
  z-index:2000;
  display:flex;
  justify-content:center;
  align-items:center;
  width:60px;
  height:60px;
  text-decoration:none;
}

.whatsapp-float svg{
  width:35px;
  height:35px;
  fill:#fff;
}

@media(max-width:768px){

  .login-box{
    padding:30px 22px;
  }

  }

    right:20px;
    width:55px;
    height:55px;
  }

  .whatsapp-float svg{
    width:30px;
    height:30px;
  }
}
</style>

<script>

/* ==================================================
   SUPABASE CONFIG
================================================== */

const SUPABASE_URL =
  'https://ufoulgbiqgjriwapuopc.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_BRqfs9ElsX5mPJgrIxdFrQ_884V2SwA';


/*
 IMPORTANT:
 This exact URL is already in your
 Supabase Redirect URLs.
*/

const AUTH_REDIRECT_URL =
  'https://glime.online/login.html';


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );


/* ==================================================
   ELEMENTS
================================================== */

const loginForm =
  document.getElementById('loginForm');

const forgotForm =
  document.getElementById('forgotForm');

const setupForm =
  document.getElementById('setupForm');

const emailInput =
  document.getElementById('email');

const passwordInput =
  document.getElementById('password');

const forgotEmailInput =
  document.getElementById('forgotEmail');

const newPasswordInput =
  document.getElementById('newPassword');

const confirmPasswordInput =
  document.getElementById('confirmPassword');

const loginBtn =
  document.getElementById('loginBtn');

const forgotBtn =
  document.getElementById('forgotBtn');

const setupBtn =
  document.getElementById('setupBtn');

const forgotPasswordLink =
  document.getElementById('forgotPasswordLink');

const backToLoginLink =
  document.getElementById('backToLoginLink');

const errorMsg =
  document.getElementById('error-message');

const successMsg =
  document.getElementById('success-message');

const title =
  document.getElementById('title');

const subtitle =
  document.getElementById('subtitle');


/* ==================================================
   MESSAGES
================================================== */

function showError(message){

  errorMsg.textContent =
    message;

  errorMsg.style.display =
    'block';

  successMsg.textContent =
    '';

  successMsg.style.display =
    'none';
}


function showSuccess(message){

  successMsg.textContent =
    message;

  successMsg.style.display =
    'block';

  errorMsg.textContent =
    '';

  errorMsg.style.display =
    'none';
}


function clearMessages(){

  errorMsg.textContent =
    '';

  errorMsg.style.display =
    'none';

  successMsg.textContent =
    '';

  successMsg.style.display =
    'none';
}


/* ==================================================
   PAGE MODES
================================================== */

function showLoginMode(){

  loginForm.classList.remove(
    'hidden'
  );

  forgotForm.classList.add(
    'hidden'
  );

  setupForm.classList.add(
    'hidden'
  );

  title.textContent =
    'Client Portal';

  subtitle.textContent =
    'Log in to view your project status.';

  emailInput.disabled =
    false;
}


function showForgotMode(){

  loginForm.classList.add(
    'hidden'
  );

  forgotForm.classList.remove(
    'hidden'
  );

  setupForm.classList.add(
    'hidden'
  );

  title.textContent =
    'Reset Your Password';

  subtitle.textContent =
    'Enter your email and we will send you a reset link.';

  forgotEmailInput.value =
    emailInput.value || '';

  clearMessages();
}


function showSetupMode(email = ''){

  loginForm.classList.add(
    'hidden'
  );

  forgotForm.classList.add(
    'hidden'
  );

  setupForm.classList.remove(
    'hidden'
  );

  title.textContent =
    'Create New Password';

  subtitle.textContent =
    email
      ? `Welcome ${email}. Create a new password to continue.`
      : 'Create a new password to continue.';

  if(email){

    emailInput.value =
      email;

    emailInput.disabled =
      true;
  }

  clearMessages();
}


/* ==================================================
   URL HELPERS
================================================== */

function getQueryParams(){

  return new URLSearchParams(
    window.location.search
  );
}


function getHashParams(){

  const hash =
    window.location.hash || '';

  if(
    hash.startsWith('#')
  ){
    return new URLSearchParams(
      hash.substring(1)
    );
  }

  return new URLSearchParams(
    hash
  );
}


function getParam(name){

  const query =
    getQueryParams();

  const hash =
    getHashParams();

  return (
    query.get(name) ||
    hash.get(name) ||
    ''
  );
}


function getFlowType(){

  const type =
    getParam('type');

  const mode =
    getParam('mode');

  if(type){
    return type.toLowerCase();
  }

  if(mode){
    return mode.toLowerCase();
  }

  return '';
}


/* ==================================================
   CLEAN URL
================================================== */

function cleanAuthUrl(){

  try{

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

  }catch(error){

    console.warn(
      'URL cleanup failed:',
      error
    );
  }
}


/* ==================================================
   FORGOT PASSWORD
================================================== */

forgotPasswordLink.addEventListener(
  'click',
  function(event){

    event.preventDefault();

    showForgotMode();
  }
);


backToLoginLink.addEventListener(
  'click',
  function(event){

    event.preventDefault();

    showLoginMode();

    clearMessages();
  }
);


forgotForm.addEventListener(
  'submit',
  async function(event){

    event.preventDefault();

    clearMessages();

    const email =
      forgotEmailInput.value
        .trim()
        .toLowerCase();

    if(!email){

      showError(
        'Please enter your email address.'
      );

      return;
    }

    forgotBtn.disabled =
      true;

    forgotBtn.textContent =
      'Sending...';

    try{

      /*
       * THIS IS THE IMPORTANT FIX.
       *
       * Supabase sends the reset email and
       * returns the user to login.html.
       */

      const {
        error
      } =
        await supabaseClient.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo:
                AUTH_REDIRECT_URL
            }
          );

      if(error){
        throw error;
      }


      showSuccess(
        'Password reset email sent. Please check your Gmail Inbox and Spam folder.'
      );

      forgotBtn.textContent =
        'Reset Email Sent';


    }catch(error){

      console.error(
        'Password reset error:',
        error
      );

      showError(
        error?.message ||
        'Could not send reset email. Please try again.'
      );

      forgotBtn.disabled =
        false;

      forgotBtn.textContent =
        'Send Reset Link';
    }
  }
);


/* ==================================================
   NORMAL LOGIN
================================================== */

loginForm.addEventListener(
  'submit',
  async function(event){

    event.preventDefault();

    clearMessages();

    const email =
      emailInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;

    if(!email || !password){

      showError(
        'Please enter your email and password.'
      );

      return;
    }

    loginBtn.disabled =
      true;

    loginBtn.textContent =
      'Verifying...';


    try{

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({
            email,
            password
          });


      if(error){
        throw error;
      }


      if(!data?.user){

        throw new Error(
          'Login could not be completed.'
        );
      }


      localStorage.setItem(
        'glime_client_email',
        data.user.email || email
      );


      showSuccess(
        'Login successful. Opening your portal...'
      );


      loginBtn.textContent =
        'Success! Opening Portal...';


      setTimeout(
        function(){

          window.location.href =
            'dashboard.html';

        },
        700
      );


    }catch(error){

      console.error(
        'Login error:',
        error
      );

      const message =
        String(
          error?.message || ''
        ).toLowerCase();


      if(
        message.includes(
          'email not confirmed'
        )
      ){

        showError(
          'Please verify your email before logging in.'
        );

      }else if(
        message.includes(
          'too many requests'
        )
      ){

        showError(
          'Too many login attempts. Please try again later.'
        );

      }else{

        showError(
          'Invalid email or password.'
        );
      }


      loginBtn.disabled =
        false;

      loginBtn.textContent =
        'Log In to Portal';
    }
  }
);


/* ==================================================
   CREATE / RESET PASSWORD
================================================== */

setupForm.addEventListener(
  'submit',
  async function(event){

    event.preventDefault();

    clearMessages();

    const password =
      newPasswordInput.value;

    const confirmPassword =
      confirmPasswordInput.value;


    if(password.length < 8){

      showError(
        'Password must be at least 8 characters.'
      );

      return;
    }


    if(password !== confirmPassword){

      showError(
        'Passwords do not match.'
      );

      return;
    }


    setupBtn.disabled =
      true;

    setupBtn.textContent =
      'Saving Password...';


    try{

      const {
        data: sessionData,
        error: sessionError
      } =
        await supabaseClient.auth
          .getSession();


      if(sessionError){
        throw sessionError;
      }


      if(!sessionData?.session){

        throw new Error(
          'Your reset session is missing or expired.'
        );
      }


      const {
        data,
        error
      } =
        await supabaseClient.auth
          .updateUser({
            password
          });


      if(error){
        throw error;
      }


      if(!data?.user){

        throw new Error(
          'Password could not be updated.'
        );
      }


      const email =
        data.user.email ||
        emailInput.value
          .trim()
          .toLowerCase();


      if(email){

        localStorage.setItem(
          'glime_client_email',
          email
        );
      }


      showSuccess(
        'Password updated successfully. Opening your Client Portal...'
      );


      setupBtn.textContent =
        'Success! Opening Portal...';


      cleanAuthUrl();


      setTimeout(
        function(){

          window.location.href =
            'dashboard.html';

        },
        1000
      );


    }catch(error){

      console.error(
        'Password update error:',
        error
      );


      const message =
        String(
          error?.message || ''
        ).toLowerCase();


      if(
        message.includes('expired') ||
        message.includes('invalid') ||
        message.includes('session') ||
        message.includes('token') ||
        message.includes('jwt')
      ){

        showError(
          'This reset link has expired or is invalid. Please request a new reset email.'
        );

      }else{

        showError(
          error?.message ||
          'Could not update password. Please request a new reset email.'
        );
      }


      setupBtn.disabled =
        false;

      setupBtn.textContent =
        'Set Password & Continue';
    }
  }
);


/* ==================================================
   AUTH STATE CHANGE
================================================== */

supabaseClient.auth.onAuthStateChange(
  function(event, session){

    console.log(
      'Supabase Auth Event:',
      event
    );


    /*
     * PASSWORD RECOVERY
     *
     * This is what we want after clicking
     * Reset Password in Gmail.
     */

    if(
      event ===
        'PASSWORD_RECOVERY' &&
      session?.user
    ){

      console.log(
        'Recovery session detected.'
      );


      showSetupMode(
        session.user.email || ''
      );


      return;
    }


    /*
     * INVITATION
     */

    if(
      event ===
        'SIGNED_IN' &&
      session?.user
    ){

      const flow =
        getFlowType();


      if(
        flow === 'invite'
      ){

        showSetupMode(
          session.user.email || ''
        );

        return;
      }
    }
  }
);


/* ==================================================
   INITIAL PAGE CHECK
================================================== */

async function initializePage(){

  clearMessages();


  const flow =
    getFlowType();


  console.log(
    'Auth flow:',
    flow
  );


  /*
   * ------------------------------------------------
   * RECOVERY / INVITE
   * ------------------------------------------------
   */

  if(
    flow === 'recovery' ||
    flow === 'invite'
  ){

    /*
     * Do NOT immediately show normal login.
     */

    showSetupMode();


    /*
     * Give Supabase time to process the
     * authentication URL.
     */

    for(
      let i = 0;
      i < 20;
      i++
    ){

      try{

        const {
          data
        } =
          await supabaseClient.auth
            .getSession();


        if(
          data?.session?.user
        ){

          console.log(
            'Authenticated recovery/invite session found.'
          );


          showSetupMode(
            data.session.user.email || ''
          );


          return;
        }

      }catch(error){

        console.warn(
          'Session check:',
          error
        );
      }


      await new Promise(
        function(resolve){

          setTimeout(
            resolve,
            250
          );

        }
      );
    }


    /*
     * If a PKCE ?code=... exists,
     * exchange it for a session.
     */

    const code =
      getParam('code');


    if(code){

      try{

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .exchangeCodeForSession(
              code
            );


        if(error){
          throw error;
        }


        if(
          data?.session?.user
        ){

          showSetupMode(
            data.session.user.email || ''
          );

          return;
        }

      }catch(error){

        console.error(
          'PKCE code exchange error:',
          error
        );
      }
    }


    /*
     * If we reached here,
     * the link did not produce a session.
     */

    showSetupMode();


    showError(
      flow === 'recovery'
        ? 'This password-reset link is expired or invalid. Please request a new reset email.'
        : 'This invitation link is expired or invalid. Please ask the admin to send a new invitation.'
    );


    return;
  }


  /*
   * ------------------------------------------------
   * URL ERROR
   * ------------------------------------------------
   */

  const urlError =
    getParam('error');

  const urlErrorCode =
    getParam('error_code');

  const urlErrorDescription =
    getParam('error_description');


  if(urlError){

    showError(
      decodeURIComponent(
        urlErrorDescription ||
        urlErrorCode ||
        urlError
      ).replace(
        /\+/g,
        ' '
      )
    );

    showLoginMode();

    return;
  }


  /*
   * ------------------------------------------------
   * NORMAL LOGIN
   * ------------------------------------------------
   */

  try{

    const {
      data
    } =
      await supabaseClient.auth
        .getSession();


    if(
      data?.session?.user
    ){

      localStorage.setItem(
        'glime_client_email',
        data.session.user.email || ''
      );


      window.location.href =
        'dashboard.html';


      return;
    }

  }catch(error){

    console.error(
      'Normal session check:',
      error
    );
  }


  showLoginMode();
}


/* ==================================================
   INPUT EVENTS
================================================== */

emailInput.addEventListener(

  clearMessages
);

passwordInput.addEventListener(

forgotEmailInput.addEventListener(

  clearMessages
);

newPasswordInput.addEventListener(
  'input',
  clearMessages
);

confirmPasswordInput.addEventListener(
  'input',
  clearMessages
);


/* ==================================================
   START
================================================== */

initializePage();

</script>
