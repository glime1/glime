<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Business Growth Intelligence | GLIME</title>
  <link rel="icon" type="image/svg+xml" href="glime_logo_clean.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#05080c;
      --card:#0d141c;
      --text:#fff;
      --muted:#9ca3af;
      --green:#00ff88;
      --cyan:#00f0ff;
      --border:rgba(255,255,255,.08);
      --card-bg:#111827;
      --card-text:#fff;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:Poppins,Arial,sans-serif;
    }

    body{
      min-height:100vh;
      color:var(--card-text);
      background:
        radial-gradient(1200px 500px at 85% -10%,rgba(0,255,136,.07),transparent 60%),
        radial-gradient(900px 500px at 0% 0%,rgba(0,240,255,.05),transparent 55%),
        var(--bg);
    }

    .intelligence-shell{
      width:100%;
      max-width:1500px;
      margin:0 auto;
      padding:22px;
    }

    /* ---------- Page header ---------- */
    .intelligence-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      flex-wrap:wrap;
      padding:6px 4px 20px;
    }

    .header-copy{min-width:0;flex:1 1 320px}

    .eyebrow{
      font-size:.7rem;
      letter-spacing:1.8px;
      color:var(--cyan);
      font-weight:700;
    }

    h1{
      margin:6px 0 0;
      font-size:clamp(1.55rem,4.2vw,2.3rem);
      line-height:1.15;
      letter-spacing:-.01em;
    }
    h1 span{color:var(--green)}

    .subtitle{
      margin:8px 0 0;
      color:var(--muted);
      font-size:.9rem;
      line-height:1.5;
    }

    .header-actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }

    .client-status{
      padding:8px 12px;
      border:1px solid rgba(0,240,255,.2);
      border-radius:999px;
      color:var(--cyan);
      font-size:.75rem;
      font-weight:700;
      white-space:nowrap;
    }

    .hero-insight{
      display:flex;
      align-items:center;
      gap:12px;
      max-width:380px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(0,255,136,.35);
      background:linear-gradient(135deg,rgba(0,255,136,.1),rgba(0,240,255,.05));
      box-shadow:0 0 0 1px rgba(0,255,136,.06),0 10px 30px rgba(0,255,136,.07);
    }
    .hero-insight[hidden]{display:none}
    .hero-insight .ico{font-size:1.3rem}
    .hero-insight small{display:block;color:var(--green);font-weight:700;font-size:.7rem;letter-spacing:.04em}
    .hero-insight span{display:block;font-size:.8rem;line-height:1.4;color:#d6dee8;overflow-wrap:anywhere}

    .status-banner{
      display:none;
      margin:0 0 16px;
      padding:14px 16px;
      border-radius:14px;
      border:1px solid rgba(255,130,145,.35);
      background:rgba(255,130,145,.06);
      color:#ffb3bc;
      font-size:.86rem;
    }
    .status-banner.show{display:block}

    /* ---------- Four stable slots (rendered in this order) ---------- */
    .intelligence-main{
      display:flex;
      flex-direction:column;
      gap:20px;
      min-height:200px;
      color:var(--card-text);
      perspective:1400px;
    }

    .gx-slot{
      position:relative;
      min-width:0;
      padding:22px 22px 22px 22px;
      border-radius:20px;
      border:1px solid var(--border);
      background:
        linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.008)),
        var(--card);
      box-shadow:
        0 18px 44px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.07),
        inset 0 0 0 1px rgba(0,255,136,.025);
      transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
    }
    .gx-slot:hover{
      transform:translateY(-2px);
      border-color:rgba(0,255,136,.2);
      box-shadow:0 24px 54px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.09);
    }
    .gx-slot:focus-within{border-color:rgba(0,255,136,.3)}

    .gx-slot::before{
      content:attr(data-step);
      position:absolute;
      top:18px;
      left:-14px;
      width:28px;
      height:28px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-size:.8rem;
      font-weight:800;
      color:#04110a;
      background:linear-gradient(135deg,#00ff88,#00f0ff);
      box-shadow:0 0 0 4px var(--bg),0 6px 16px rgba(0,255,136,.3);
      z-index:2;
    }

    /* Uniform look for the two untouched modules (Evidence & Decisions) */
    #glime-evidence-confidence-card,
    .gG2-card{
      --card-bg:#111827;
      color:#fff;
      margin:0 !important;
    }

    /* Existing Phase G uses var(--card-bg,#fff); keep it dark. */
    .gG2-card{--card-bg:#111827}

    /* The slot already provides the surface; avoid a box inside a box. */
    #glime-evidence-confidence-card,
    .gG2-card{
      border:0 !important;
      box-shadow:none !important;
      background:transparent !important;
      padding:0 !important;
    }

    .loading{
      padding:30px;
      text-align:center;
      border:1px solid var(--border);
      border-radius:16px;
      background:var(--card);
      color:var(--muted);
    }

    @media (max-width:700px){
      .intelligence-shell{padding:12px 12px 12px 22px}
      .intelligence-header{align-items:flex-start;padding-bottom:14px}
      .header-actions{width:100%;justify-content:flex-start}
      .hero-insight{max-width:none;width:100%}
      .gx-slot{padding:16px 14px}
      .gx-slot::before{left:-12px;top:14px}
      .client-status{white-space:normal}
    }

    @media (prefers-reduced-motion:reduce){
      .gx-slot,.gx-slot:hover{transition:none;transform:none}
    }
  </style>
  <link rel="stylesheet" href="glime-app-shell.css">
  <script src="glime-app-shell.js" defer></script>
</head>

<body data-gas-title="Business Growth Intelligence">

  <div class="intelligence-shell" data-gas-content>

    <header class="intelligence-header">

      <div class="header-copy">
        <div class="eyebrow">GLIME INTELLIGENCE</div>

        <h1>
          Business Growth <span>Intelligence</span>
        </h1>

        <p class="subtitle">
          See what changed, understand why it matters, and know what to do next.
        </p>
      </div>

      <div class="header-actions">

        <div
          class="hero-insight"
          id="gxHeroInsight"
          hidden
        >
          <span class="ico" aria-hidden="true">💡</span>
          <div>
            <small>GLIME AI Insight</small>
            <span data-hero-text></span>
          </div>
        </div>

        <div
          class="client-status"
          id="clientStatus"
        >
          Authenticating…
        </div>

      </div>

    </header>

    <div
      class="status-banner"
      id="gxStatusBanner"
      role="alert"
    ></div>

    <main
      class="intelligence-main main-content"
      id="glimeIntelligenceMain"
    >

      <section
        class="gx-slot"
        id="glime-growth-overview-slot"
        data-step="1"
        aria-label="Daily Business Pulse"
      ></section>

      <section
        class="gx-slot"
        id="glime-action-impact-slot"
        data-step="2"
        aria-label="GLIME Action Impact"
      ></section>

      <section
        class="gx-slot"
        id="glime-evidence-confidence-slot"
        data-step="3"
        aria-label="Evidence and Confidence"
      ></section>

      <section
        class="gx-slot"
        id="glime-decision-action-slot"
        data-step="4"
        aria-label="Decisions and Next Actions"
      ></section>

    </main>

  </div>


  <script>
    (() => {
      "use strict";

      const SUPABASE_URL =
        "https://ufoulgbiqgjriwapuopc.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_BRqfs9ElsX5mPJgrIxdFrQ_884V2SwA";


      /*
       * Use one shared Supabase client.
       *
       * All four modules reuse window.supabaseClient.
       */
      window.supabaseClient =
        window.supabaseClient ||
        (
          window.supabase?.createClient
            ? window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
              )
            : null
        );


      function banner(message) {

        const el =
          document.getElementById(
            "gxStatusBanner"
          );

        if (!el) return;

        el.textContent = message;
        el.classList.add("show");
      }


      async function boot() {

        const status =
          document.getElementById(
            "clientStatus"
          );


        if (!window.supabaseClient) {

          status.textContent =
            "Supabase unavailable";

          banner(
            "GLIME Intelligence could not connect to Supabase."
          );

          return;
        }


        const {
          data,
          error
        } =
          await window.supabaseClient
            .auth
            .getSession();


        if (
          error ||
          !data?.session
        ) {

          status.textContent =
            "Login required";

          banner(
            "Please sign in to view your GLIME Business Growth Intelligence."
          );

          return;
        }


        status.textContent =
          "Secure client session";


        /*
         * Important:
         *
         * No client_id is accepted from
         * URL/query parameters.
         *
         * The modules use the authenticated
         * Supabase session and existing RLS
         * policies.
         */
      }


      if (
        document.readyState ===
        "loading"
      ) {

        document.addEventListener(
          "DOMContentLoaded",
          boot,
          { once:true }
        );

      } else {

        boot();

      }

    })();
  </script>


  <!-- Existing production modules (filenames unchanged) -->

  <script
    src="glime-phase-e-impact-analysis.js"
  ></script>

  <script
    src="glime-phase-e-proactive-insights.js"
  ></script>

  <script
    src="glime-phase-f-evidence-confidence.js"
  ></script>

  <script
    src="glime-phase-g-decision-action-center.js"
  ></script>

</body>
</html>
