<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Glime Web Agency</title>
    <meta name="description" content="Ready to upgrade your fashion brand? Contact Glime Web Agency today to build your 100% custom, unhackable digital growth engine in Surat & Jaipur.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="glime-logo.jpg">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables */
        :root {
            --bg-dark: #0a0f16;
            --card-bg: #111827;
            --neon-green: #00ff88;
            --cyan-blue: #00f0ff;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --banner-bg: #ff4757;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; position: relative; display: flex; flex-direction: column; min-height: 100vh; }
        .gradient-text { background: linear-gradient(90deg, var(--neon-green), var(--cyan-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Navbar */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(10, 15, 22, 0.9); backdrop-filter: blur(10px); position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo a { font-size: 24px; font-weight: 700; letter-spacing: 1px; color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo a span { color: var(--neon-green); }
        .nav-links { display: flex; gap: 50px; list-style: none; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-weight: 400; transition: 0.3s; font-size: 1.05rem; }
        .nav-links a:hover, .nav-links a.active { color: var(--cyan-blue); font-weight: 600; }
        .btn-primary { background: linear-gradient(90deg, var(--neon-green), var(--cyan-blue)); color: #000; padding: 12px 30px; border-radius: 30px; text-decoration: none; font-weight: 600; transition: 0.3s; box-shadow: 0 0 15px rgba(0, 255, 136, 0.3); border: none; cursor: pointer; display: inline-block; text-align: center; }
        .btn-primary:hover { box-shadow: 0 0 25px rgba(0, 240, 255, 0.6); transform: translateY(-2px); }

        /* Page Header */
        .page-header { padding: 150px 20px 40px 20px; text-align: center; background: radial-gradient(circle at center, rgba(0, 240, 255, 0.05) 0%, transparent 70%); }
        .page-header h1 { font-size: 3rem; margin-bottom: 15px; }
        .page-header p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; line-height: 1.6; }

        /* Contact Form Section */
        .section { padding: 40px 8% 80px 8%; flex-grow: 1; }
        .contact-box { max-width: 700px; margin: 0 auto; text-align: left; background: var(--card-bg); padding: 50px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .form-group label span { color: #ff4757; }
        input, textarea { width: 100%; padding: 15px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; font-size: 1rem; transition: 0.3s; }
        input:focus, textarea:focus { outline: none; border-color: var(--cyan-blue); background: rgba(255,255,255,0.05); box-shadow: 0 0 15px rgba(0, 240, 255, 0.1); }
        
        footer { text-align: center; padding: 40px 20px; background: #05080c; color: var(--text-muted); font-size: 0.95rem; border-top: 1px solid rgba(255,255,255,0.05); width: 100%; }
        footer span { color: var(--cyan-blue); font-weight: 600; }

        .hamburger { display: none; cursor: pointer; font-size: 28px; color: var(--text-main); }
        
        /* 📱 STRICT MOBILE RESPONSIVE CSS 📱 */
        @media (max-width: 768px) {
            .page-header { padding: 120px 15px 30px 15px; }
            .page-header h1 { font-size: 2rem; }
            .page-header p { font-size: 0.9rem; }
            
            .section { padding: 20px 5% 50px 5%; }
            .contact-box { padding: 25px 15px; }
            
            .form-group { margin-bottom: 15px; }
            .form-group label { font-size: 0.8rem; margin-bottom: 5px; }
            input, textarea { padding: 12px; font-size: 0.9rem; }

            nav { padding: 15px 5%; }
            .logo a { font-size: 20px; }
            .nav-links { display: none; flex-direction: column; position: absolute; top: 60px; left: 0; width: 100%; background: var(--card-bg); padding: 15px; text-align: center; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
            .nav-links.active { display: flex; }
            .hamburger { display: block; }
        }

        .fade-in { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><a href="index.html">G<span>↑</span>ime</a></div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio.html">Our Work</a></li>
            <li><a href="index.html#services">Growth Engines</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <a href="contact.html" class="btn-primary" style="display: none;" id="navBtn">Start Your Project</a>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </nav>

    <!-- Header -->
    <header class="page-header fade-in">
        <h1>Ready to <span class="gradient-text">Upgrade?</span></h1>
        <p>Tell us about your brand and let's build a custom digital growth engine that drives actual sales.</p>
    </header>

    <!-- Contact Form Section -->
    <section class="section fade-in">
        <div class="contact-box">
            <form action="https://api.web3forms.com/submit" method="POST">
                
                <!-- Web3Forms Access Key -->
                <input type="hidden" name="access_key" value="9680bea5-d164-41df-b501-7bf5ad02aa42">
                
                <div class="form-group"><label>Your Full Name</label><input type="text" name="fullName" placeholder="Your full name" required></div>
                <div class="form-group"><label>Business Name <span>*</span></label><input type="text" name="businessName" placeholder="Your business" required></div>
                <div class="form-group"><label>Email Address <span>*</span></label><input type="email" name="email" placeholder="name@company.com" required></div>
                <div class="form-group"><label>Phone Number <span>*</span></label><input type="tel" name="phone" placeholder="+91 98250 00000" required></div>
                
                <div class="form-group"><label>City</label><input type="text" name="city" placeholder="e.g. Surat"></div>
                <div class="form-group"><label>State / Province</label><input type="text" name="state" placeholder="e.g. Gujarat"></div>
                <div class="form-group"><label>Country</label><input type="text" name="country" placeholder="e.g. India"></div>
                
                <div class="form-group"><label>Project Details <span>*</span></label><textarea name="message" rows="4" placeholder="Tell us about your project requirements..." required></textarea></div>
                
                <button type="submit" class="btn-primary" style="width: 100%; border-radius: 8px; font-size: 1.1rem; padding: 15px;">Submit Details</button>
            </form>
        </div>
    </section>

    <footer>
        <p>Designed & Developed by <span>Vishal Gouttam & Team</span> | <span>Glime </span> © 2026</p>
    </footer>

    <script>
        // Scroll Animation
        const observer = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('visible'); }}); }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in').forEach((el) => { observer.observe(el); });

        // Navbar Mobile Menu
        function toggleMenu() { document.getElementById('navLinks').classList.toggle('active'); }
        if(window.innerWidth > 768) { document.getElementById('navBtn').style.display = 'block'; }

        // Mobile Menu Auto-Close Bug Fix
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('active');
            });
        });
    </script>
</body>
</html>
