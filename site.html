<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GLIME Site</title>
<meta name="theme-color" content="#071016">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071016;color:#eaf2fb;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;text-align:center;padding:24px}
.s{width:34px;height:34px;border-radius:50%;border:3px solid #ffffff22;border-top-color:#52e8ff;animation:r .8s linear infinite;margin:0 auto 14px}@keyframes r{to{transform:rotate(360deg)}}
h1{font-size:1.4rem;margin:0 0 8px}p{color:#8fa3b8;margin:0 0 18px}a{display:inline-block;padding:12px 22px;border-radius:14px;background:linear-gradient(135deg,#52e8ff,#50f5a8);color:#04120b;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div id="m"><div class="s"></div><p>Loading…</p></div>
<script src="glime-site-render.js?v=20261119"></script>
<script>
(function () {
  var GS = window.GlimeSite;
  var slug = (new URLSearchParams(location.search).get('u') || '').toLowerCase().trim();
  function nf(msg) {
    document.title = 'Site not found | GLIME';
    document.getElementById('m').innerHTML = '<h1>' + msg + '</h1><p>Please check the link and try again.</p><a href="https://glime.online">Visit GLIME</a>';
  }
  if (!/^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$/.test(slug)) { nf('Site not found'); return; }
  function call(fn, body) {
    return fetch(GS.SUPABASE_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: GS.KEY }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); });
  }
  Promise.all([call('website_public_get', { p_slug: slug }), call('website_looks_get', {}).catch(function () { return null; })]).then(function (rs) {
    var x = rs[0]; if (rs[1] && rs[1].ok) GS.setLooks(rs[1].j);
    if (!x.ok || !x.j || !x.j.config) { nf('This site is not available right now'); return; }
    var html = GS.buildDocument(x.j.config, { offers: x.j.offers || [], slug: x.j.slug || slug }, {});
    document.open(); document.write(html); document.close();
  }).catch(function () { nf('Network problem - please try again'); });
})();
</script>
</body>
</html>
