<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings | GLIME</title>
<link rel="icon" type="image/svg+xml" href="glime_logo_clean.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#071016;--surf:#101b29;--surf2:#0b1520;--bd:rgba(184,222,234,.13);
  --tx:#f4fbfd;--mu:#9cabb9;--cy:#52e8ff;--gr:#50f5a8;--rd:#ff8291;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Manrope,Arial,sans-serif;line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{width:min(1180px,calc(100% - 24px));margin:0 auto;padding:18px 0 70px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand img{width:42px;height:42px}
.back{color:var(--cy);font-size:.8rem;font-weight:800}
.hero{margin-bottom:22px}
.eyebrow{color:var(--cy);font-size:.68rem;letter-spacing:.14em;font-weight:800}
h1{font-size:2rem;letter-spacing:-.035em;margin:4px 0 5px}
.sub{color:var(--mu);font-size:.84rem}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
.nav{position:sticky;top:14px;background:var(--surf);border:1px solid var(--bd);border-radius:17px;padding:8px}
.nav-title{padding:10px 10px 8px;color:var(--mu);font-size:.67rem;font-weight:800;letter-spacing:.12em}
.nav button{
  width:100%;text-align:left;border:0;background:transparent;color:var(--mu);
  padding:10px 11px;border-radius:10px;font-size:.78rem;font-weight:800;margin-bottom:3px
}
.nav button:hover{background:rgba(82,232,255,.06);color:var(--tx)}
.nav button.active{background:rgba(82,232,255,.10);color:var(--cy)}
.content{min-width:0}
.section{display:none;scroll-margin-top:18px}
.section.active{display:block}
.section-head{margin-bottom:13px}
.section-head h2{font-size:1.18rem}
.section-head p{color:var(--mu);font-size:.76rem;margin-top:2px}
.channel-card{
  background:var(--surf);border:1px solid var(--bd);border-radius:18px;
  padding:18px;margin-bottom:15px
}
.channel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.channel-name{display:flex;align-items:center;gap:9px;font-size:1.02rem;font-weight:800}
.badge{font-size:.66rem;font-weight:800;padding:4px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.badge.on{color:var(--gr);border-color:rgba(80,245,168,.38)}
.badge.off{color:var(--rd);border-color:rgba(255,130,145,.32)}
.row{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:13px 0;border-top:1px solid var(--bd)
}
.row-info{min-width:0}
.row-info b{display:block;font-size:.82rem}
.row-info small{display:block;color:var(--mu);font-size:.71rem;line-height:1.45;margin-top:2px}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#2a3a4b;border-radius:99px;transition:.2s}
.sw span:before{
  content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:.2s
}
.sw input:checked+span{background:var(--gr)}
.sw input:checked+span:before{transform:translateX(20px)}
.select{
  min-width:150px;background:var(--surf2);color:var(--tx);
  border:1px solid var(--bd);border-radius:9px;padding:9px 10px;outline:none
}
.select:focus{border-color:rgba(82,232,255,.45)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.btn{
  border:1px solid var(--bd);background:transparent;color:var(--tx);
  border-radius:10px;padding:10px 14px;font-size:.78rem;font-weight:800
}
.btn.primary{background:linear-gradient(105deg,var(--gr),var(--cy));color:#031014;border:0}
.btn.danger{color:var(--rd);border-color:rgba(255,130,145,.38)}
.btn:disabled{opacity:.5;cursor:default}
.note{color:var(--mu);font-size:.7rem;margin-top:9px}
.empty,.error{
  background:var(--surf);border:1px solid var(--bd);border-radius:16px;
  padding:18px;color:var(--mu);font-size:.78rem
}
.error{color:var(--rd)}
.loading{color:var(--mu);font-size:.78rem;padding:10px 0}
.addon-slot{display:block}
#toast{
  position:fixed;right:14px;bottom:14px;background:#101b28;border:1px solid var(--bd);
  padding:11px 14px;border-radius:10px;font-size:.77rem;display:none;z-index:50
}
.mobile-nav{display:none}
@media(max-width:760px){
  .wrap{width:min(100% - 18px,620px);padding-top:12px}
  h1{font-size:1.7rem}
  .layout{grid-template-columns:1fr}
  .nav{display:none}
  .mobile-nav{
    display:flex;overflow:auto;gap:7px;padding:7px;background:var(--surf);
    border:1px solid var(--bd);border-radius:14px;margin-bottom:14px
  }
  .mobile-nav button{
    flex:none;border:1px solid var(--bd);background:transparent;color:var(--mu);
    padding:8px 11px;border-radius:9px;font-size:.72rem;font-weight:800
  }
  .mobile-nav button.active{color:var(--cy);border-color:rgba(82,232,255,.35);background:rgba(82,232,255,.07)}
  .row{align-items:flex-start}
  .select{min-width:135px}
}
</style>
</head>

<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="dashboard.html">
      <img src="glime_logo_clean.svg" alt="GLIME">
      <span id="biz">GLIME</span>
    </a>
    <a class="back" href="dashboard.html">← Dashboard</a>
  </div>

  <div class="hero">
    <div class="eyebrow">ACCOUNT SETTINGS</div>
    <h1>Settings</h1>
    <p class="sub">Manage GLIME channel behaviour from your settings area. </p>
  </div>

  <div id="mobileNav" class="mobile-nav" aria-label="Settings navigation"></div>

  <div class="layout">
    <aside id="settingsNav" class="nav" aria-label="Settings navigation">
      <div class="nav-title">SETTINGS</div>
    </aside>

    <main id="settingsContent" class="content">
      <div class="loading">Loading settings…</div>
    </main>
  </div>

  <div id="toast"></div>
</div>

<script>
/*
  GLIME SETTINGS SHELL
  --------------------
  This file intentionally contains the stable shell only:
  - authentication
  - client context
  - settings navigation
  - module registration
  - shared UI helpers
  - current channel-settings module

  Future modules/addons can be loaded after this file and register themselves:
      window.GLIME_SETTINGS.register({
        id: 'billing',
        label: 'Billing',
        order: 30,
        render: async ({container, api}) => { ... }
      });

  Do not create another settings.html for a new settings area.
  Add a module/addon instead and reuse the shared API/helpers.

  Deep links:  settings.html#ai            opens the AI module
               settings.html#ai-knowledge  opens AI > Knowledge
*/

const sb = supabase.createClient(
  'https://ufoulgbiqgjriwapuopc.supabase.co',
  'sb_publishable_BRqfs9ElsX5mPJgrIxdFrQ_884V2SwA'
);

const $ = id => document.getElementById(id);

const CHANNELS = [
  {key:'whatsapp', name:'WhatsApp', icon:'◉'},
  {key:'instagram', name:'Instagram', icon:'◎'}
];

const state = {
  session: null,
  client: null,
  settings: [],
  connections: [],
  instagramConnection: null,
  activeModule: null
};

const modules = new Map();

function toast(message, bad=false){
  const el = $('toast');
  el.textContent = message;
  el.style.color = bad ? '#ff8291' : '#fff';
  el.style.display = 'block';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.style.display='none', 3200);
}

function escapeHtml(value){
  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function registerModule(module){
  if(!module || !module.id || !module.label || typeof module.render !== 'function'){
    console.warn('Invalid GLIME settings module', module);
    return;
  }
  modules.set(module.id, {
    order: 100,
    ...module
  });
}

window.GLIME_SETTINGS = {
  register: registerModule,
  state,
  api: {
    supabase: sb,
    getSettings: () => state.settings,
    getConnections: () => state.connections,
    getClient: () => state.client,
    channels: CHANNELS
  },
  ui: {
    toast,
    escapeHtml
  }
};

function sortedModules(){
  return [...modules.values()].sort((a,b) => (a.order||0)-(b.order||0));
}

function renderNavigation(){
  const list = sortedModules();
  const desktop = $('settingsNav');
  const mobile = $('mobileNav');

  desktop.querySelectorAll('[data-module]').forEach(x=>x.remove());
  mobile.innerHTML = '';

  list.forEach((m, index) => {
    const d = document.createElement('button');
    d.type = 'button';
    d.dataset.module = m.id;
    d.textContent = m.label;
    d.onclick = () => openModule(m.id);
    desktop.appendChild(d);

    const mb = d.cloneNode(true);
    mb.onclick = () => openModule(m.id);
    mobile.appendChild(mb);

    if(index === 0 && !state.activeModule) state.activeModule = m.id;
  });

  markActiveNavigation();
}

function markActiveNavigation(){
  document.querySelectorAll('[data-module]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.module === state.activeModule);
  });
}

async function openModule(id){
  const module = modules.get(id);
  if(!module) return;

  state.activeModule = id;
  markActiveNavigation();

  const content = $('settingsContent');
  content.innerHTML = `<div class="loading">Loading ${escapeHtml(module.label)}…</div>`;

  try{
    await module.render({
      container: content,
      state,
      api: window.GLIME_SETTINGS.api,
      ui: window.GLIME_SETTINGS.ui
    });
  }catch(error){
    console.error(error);
    content.innerHTML = `<div class="error">Could not load this settings section. ${escapeHtml(error.message || 'Unknown error')}</div>`;
  }
}

/* ---------- Core channel settings module ---------- */

function settingFor(channel){
  return state.settings.find(x => x.channel === channel) || {
    channel,
    enabled:true,
    connection_enabled:true,
    ai_enabled:true,
    automation_enabled:true,
    followups_enabled:true,
    ai_mode:'manual'
  };
}

function connectionFor(channel){
  return state.connections.find(x => x.channel === channel) || {};
}

function switchHtml(channel, field, checked){
  return `
    <label class="sw" title="${escapeHtml(field)}">
      <input type="checkbox" data-ch="${escapeHtml(channel)}" data-field="${escapeHtml(field)}" ${checked ? 'checked':''}>
      <span></span>
    </label>`;
}

function channelCard(channel){
  const s = settingFor(channel.key);
  const c = connectionFor(channel.key);
  const connected = c.status === 'connected';

  return `
    <section class="channel-card" data-channel-card="${escapeHtml(channel.key)}">
      <div class="channel-head">
        <div class="channel-name">${channel.icon} ${escapeHtml(channel.name)}</div>
        <span class="badge ${connected?'on':'off'}">
          ${connected ? '● Connected' : 'Not connected'}
        </span>
      </div>

      <div class="row">
        <div class="row-info">
          <b>Channel enabled</b>
          <small>Enable or disable GLIME processing for this channel without deleting its connection.</small>
        </div>
        ${switchHtml(channel.key,'enabled',!!s.enabled)}
      </div>

      <div class="row">
        <div class="row-info">
          <b>AI replies</b>
          <small>Allow GLIME AI to handle incoming conversations on this channel.</small>
        </div>
        ${switchHtml(channel.key,'ai_enabled',!!s.ai_enabled)}
      </div>

      <div class="row">
        <div class="row-info">
          <b>Automation</b>
          <small>Allow automated channel workflows that are supported by this client setup.</small>
        </div>
        ${switchHtml(channel.key,'automation_enabled',!!s.automation_enabled)}
      </div>

      <div class="row">
        <div class="row-info">
          <b>Follow-ups</b>
          <small>Allow the follow-up system to operate on this channel.</small>
        </div>
        ${switchHtml(channel.key,'followups_enabled',!!s.followups_enabled)}
      </div>

      <div class="row">
        <div class="row-info">
          <b>AI mode</b>
          <small>Controls how AI actions are handled. The available values match the existing database constraint.</small>
        </div>
        <select class="select" data-ch="${escapeHtml(channel.key)}" data-field="ai_mode">
          <option value="manual" ${s.ai_mode==='manual'?'selected':''}>Manual</option>
          <option value="approval" ${s.ai_mode==='approval'?'selected':''}>Approval</option>
          <option value="automatic" ${s.ai_mode==='automatic'?'selected':''}>Automatic</option>
        </select>
      </div>

      <div class="actions">
        <button class="btn primary" data-save-channel="${escapeHtml(channel.key)}">Save changes</button>
        ${connected ? `<button class="btn danger" data-disconnect-channel="${escapeHtml(channel.key)}">Disconnect ${escapeHtml(channel.name)}</button>` : ''}
      </div>

      <p class="note">
        Disconnecting changes the existing channel connection state; it does not delete saved customer/conversation data.
      </p>
    </section>`;
}

async function saveChannel(channel, button){
  const card = document.querySelector(`[data-channel-card="${channel}"]`);
  if(!card) return;

  const current = settingFor(channel);
  const payload = {
    client_id: state.client.client_id,
    channel,
    enabled: card.querySelector('[data-field="enabled"]').checked,
    connection_enabled: current.connection_enabled !== false,
    ai_enabled: card.querySelector('[data-field="ai_enabled"]').checked,
    automation_enabled: card.querySelector('[data-field="automation_enabled"]').checked,
    followups_enabled: card.querySelector('[data-field="followups_enabled"]').checked,
    ai_mode: card.querySelector('[data-field="ai_mode"]').value,
    updated_by: state.session.user.id,
    updated_at: new Date().toISOString()
  };

  button.disabled = true;

  const {error} = await sb
    .from('client_channel_settings')
    .upsert(payload, {onConflict:'client_id,channel'});

  button.disabled = false;

  if(error){
    console.error(error);
    toast(error.message || 'Could not save settings', true);
    return;
  }

  state.settings = state.settings.filter(x => x.channel !== channel);
  state.settings.push(payload);
  toast(`${CHANNELS.find(x=>x.key===channel)?.name || channel} settings saved`);
}

async function disconnectChannel(channel, button){
  const name = CHANNELS.find(x=>x.key===channel)?.name || channel;

  if(!confirm(
    `Disconnect ${name}? GLIME will stop the existing channel connection. ` +
    `Saved customer and conversation data will not be deleted.`
  )) return;

  button.disabled = true;

  const {error} = await sb.rpc('disconnect_my_channel',{p_channel:channel});

  if(error){
    button.disabled = false;
    console.error(error);
    toast(error.message || 'Could not disconnect channel', true);
    return;
  }

  toast(`${name} disconnected`);
  await loadChannelData();

  if(state.activeModule === 'channels') openModule('channels');
}

async function renderChannels({container}){
  container.innerHTML = `
    <div class="section-head">
      <h2>Channels</h2>
      <p>Control the behaviour of each connected GLIME sales channel.</p>
    </div>
    ${CHANNELS.map(channelCard).join('')}
    <div class="addon-slot" id="channelAddonSlot"></div>
  `;

  container.querySelectorAll('[data-save-channel]').forEach(button => {
    button.onclick = () => saveChannel(button.dataset.saveChannel, button);
  });

  container.querySelectorAll('[data-disconnect-channel]').forEach(button => {
    button.onclick = () => disconnectChannel(button.dataset.disconnectChannel, button);
  });
}

registerModule({
  id:'channels',
  label:'Channels',
  order:10,
  render:renderChannels
});

/* Core navigation placeholders. Feature logic is supplied by addons. */
registerModule({
  id:'ai',
  label:'AI',
  order:20,
  render: async ({container}) => {
    container.innerHTML = `
      <div class="section-head">
        <h2>AI</h2>
        <p>The AI settings module is loading…</p>
      </div>
      <div class="empty">Please wait for the AI settings module to load.</div>`;
  }
});

registerModule({
  id:'automation',
  label:'Automation',
  order:30,
  render: async ({container}) => {
    container.innerHTML = `
      <div class="section-head">
        <h2>Automation</h2>
        <p>Automation settings can be added here without changing the Settings shell.</p>
      </div>
      <div class="empty">No additional automation settings module is installed yet.</div>`;
  }
});

registerModule({
  id:'followups',
  label:'Follow-ups',
  order:40,
  render: async ({container}) => {
    container.innerHTML = `
      <div class="section-head">
        <h2>Follow-ups</h2>
        <p>Follow-up settings can be added here without changing the Settings shell.</p>
      </div>
      <div class="empty">No additional follow-up settings module is installed yet.</div>`;
  }
});

/* ---------- Data loading ---------- */

/*
  Both WhatsApp and Instagram connection status are read from
  client_channel_connections only. The raw provider tables
  (whatsapp_connections, instagram_connections) hold access tokens and are not
  readable from the browser, so this page must never query them directly.
*/
async function loadChannelData(){
  const [settingsResult, connectionsResult] = await Promise.all([
    sb.from('client_channel_settings')
      .select('client_id,channel,enabled,connection_enabled,ai_enabled,automation_enabled,followups_enabled,ai_mode,updated_by,created_at,updated_at')
      .eq('client_id', state.client.client_id),

    sb.from('client_channel_connections')
      .select('client_id,channel,status,customer_reachable,can_send,connected_at,last_verified_at')
      .eq('client_id', state.client.client_id)
  ]);

  if(settingsResult.error) throw settingsResult.error;
  if(connectionsResult.error) throw connectionsResult.error;

  state.settings = settingsResult.data || [];
  state.connections = connectionsResult.data || [];
}

async function init(){
  const {data:{session}, error:sessionError} = await sb.auth.getSession();

  if(sessionError){
    console.error(sessionError);
    location.href='login.html';
    return;
  }

  if(!session){
    location.href='login.html';
    return;
  }

  state.session = session;

  const {data:client, error:clientError} = await sb
    .from('client_data')
    .select('client_id,business_name,name')
    .eq('auth_user_id',session.user.id)
    .maybeSingle();

  if(clientError || !client){
    console.error(clientError);
    $('settingsContent').innerHTML =
      '<div class="error">Your GLIME client profile could not be loaded.</div>';
    return;
  }

  state.client = client;
  $('biz').textContent = client.business_name || client.name || 'GLIME';

  try{
    await loadChannelData();
  }catch(error){
    console.error(error);
    $('settingsContent').innerHTML =
      `<div class="error">Could not load Settings. ${escapeHtml(error.message || 'Unknown error')}</div>`;
    return;
  }

  renderNavigation();
  await openModule(state.activeModule || 'channels');
}

async function loadSettingsAddon(src){
  return new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src=src;
    script.async=false;
    script.onload=resolve;
    script.onerror=()=>reject(new Error(`Could not load ${src}`));
    document.head.appendChild(script);
  });
}

(async()=>{
  try{
    await loadSettingsAddon('settings-ai-addon.js');
  }catch(error){
    console.error('Settings addon load error:',error);
  }

  /* Deep links, e.g. settings.html#ai-knowledge (used by the Services page) */
  const hash = (location.hash || '').replace('#','').toLowerCase();
  if(hash === 'ai' || hash.startsWith('ai-')){
    state.activeModule = 'ai';
  }

  await init();

  if(hash === 'ai-knowledge'){
    const tab = document.querySelector('[data-act="tab"][data-v="knowledge"]');
    if(tab) tab.click();
  }
})();
</script>
</body>
</html>
