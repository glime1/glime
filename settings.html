<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings | GLIME</title>
<link rel="icon" type="image/svg+xml" href="glime_logo_clean.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#071016;--surf:#101b29;--bd:rgba(184,222,234,.13);--tx:#f4fbfd;--mu:#9cabb9;--cy:#52e8ff;--gr:#50f5a8;--rd:#ff8291}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Manrope,Arial,sans-serif;line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{width:min(900px,calc(100% - 24px));margin:0 auto;padding:20px 0 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand img{width:44px;height:44px}
.back{color:var(--cy);font-size:.8rem;font-weight:700}
.eyebrow{color:var(--cy);font-size:.7rem;letter-spacing:.13em}
h1{font-size:1.9rem;letter-spacing:-.03em;margin:4px 0 6px}
.sub{color:var(--mu);font-size:.85rem;margin-bottom:22px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.head h2{font-size:1.1rem}
.badge{font-size:.68rem;font-weight:800;padding:4px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.badge.on{color:var(--gr);border-color:rgba(80,245,168,.4)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid var(--bd)}
.row b{font-size:.85rem}.row small{display:block;color:var(--mu);font-size:.72rem}
input[type=number]{width:110px;background:#0b1520;color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px;font:inherit}
.sw{position:relative;width:46px;height:26px;flex:none}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#2a3a4b;border-radius:99px;cursor:pointer;transition:.2s}
.sw span:before{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--gr)}.sw input:checked+span:before{transform:translateX(20px)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-weight:800;font-size:.8rem;border-radius:11px;padding:11px 16px;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--tx)}
button.p{background:linear-gradient(105deg,var(--gr),var(--cy));color:#031014;border:0}
button.d{color:var(--rd);border-color:rgba(255,130,145,.4)}
button:disabled{opacity:.5;cursor:default}
#toast{position:fixed;right:14px;bottom:14px;background:#101b28;border:1px solid var(--bd);padding:11px 14px;border-radius:10px;font-size:.78rem;display:none;z-index:9}
.note{color:var(--mu);font-size:.72rem;margin-top:10px}
</style></head>
<body><div class="wrap">
<div class="top"><a class="brand" href="dashboard.html"><img src="glime_logo_clean.svg" alt="GLIME"><span id="biz">GLIME</span></a><a class="back" href="dashboard.html">← Dashboard</a></div>
<div class="eyebrow">CHANNEL CONTROLS</div><h1>Settings</h1>
<p class="sub">Control how GLIME's AI works on your WhatsApp and Instagram. Changes apply to AI replies; messages you type yourself are not blocked.</p>
<div id="list"><div class="sub">Loading…</div></div>
<div id="toast"></div></div>
<script>
const sb=supabase.createClient('https://ufoulgbiqgjriwapuopc.supabase.co','sb_publishable_BRqfs9ElsX5mPJgrIxdFrQ_884V2SwA');
const $=id=>document.getElementById(id);
/* ADD NEW CHANNELS HERE */
const CHANNELS=[{key:'whatsapp',name:'WhatsApp',icon:'◉'},{key:'instagram',name:'Instagram',icon:'◎'}];
/* ADD NEW CONTROLS HERE: type toggle|number. field = column name (ai_paused, daily_limit) or extra.<name> */
const CONTROLS=[
 {field:'ai_paused',type:'toggle',label:'AI replies',hint:'Switch off to pause all AI replies on this channel.',invert:true},
 {field:'daily_limit',type:'number',label:'AI messages per day',hint:'Leave empty for no limit. Resets at midnight (IST).'}
];
let data=[];
function toast(m,bad){const t=$('toast');t.textContent=m;t.style.color=bad?'#ff8291':'#fff';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
const getV=(s,f)=>f.startsWith('extra.')?(s.extra||{})[f.slice(6)]:s[f];
function render(){
 $('list').innerHTML=CHANNELS.map(ch=>{const s=data.find(x=>x.channel===ch.key)||{};
  const rows=CONTROLS.map(c=>{const v=getV(s,c.field);
   const inp=c.type==='toggle'?`<label class="sw"><input type="checkbox" data-ch="${ch.key}" data-f="${c.field}" ${(c.invert?!v:!!v)?'checked':''}><span></span></label>`
    :`<input type="number" min="0" data-ch="${ch.key}" data-f="${c.field}" value="${v??''}" placeholder="No limit">`;
   return `<div class="row"><div><b>${c.label}</b><small>${c.hint||''}${c.field==='daily_limit'?` Sent today: <b>${s.sent_today||0}</b>`:''}</small></div>${inp}</div>`}).join('');
  return `<div class="card"><div class="head"><h2>${ch.icon} ${ch.name}</h2><span class="badge ${s.connected?'on':''}">${s.connected?'● Connected':'Not connected'}</span></div>${rows}
  <div class="btns"><button class="p" data-save="${ch.key}">Save</button>${s.connected?`<button class="d" data-disc="${ch.key}">Disconnect ${ch.name}</button>`:''}</div>
  ${s.connected?'':'<p class="note">Connect this channel from its Sales page first.</p>'}</div>`}).join('');
 document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save,b));
 document.querySelectorAll('[data-disc]').forEach(b=>b.onclick=()=>disc(b.dataset.disc,b));
}
async function load(){const{data:d,error}=await sb.rpc('get_my_channel_settings');if(error)return toast(error.message,true);data=d;render()}
async function save(ch,btn){
 const q=f=>document.querySelector(`[data-ch="${ch}"][data-f="${f}"]`),extra={};
 let paused=false,limit=null;
 for(const c of CONTROLS){const el=q(c.field);if(!el)continue;
  const val=c.type==='toggle'?(c.invert?!el.checked:el.checked):(el.value===''?null:parseInt(el.value,10));
  if(c.field==='ai_paused')paused=val;else if(c.field==='daily_limit')limit=val;else extra[c.field.replace('extra.','')]=val}
 if(limit!==null&&(isNaN(limit)||limit<0))return toast('Enter a valid number',true);
 btn.disabled=true;
 const{error}=await sb.rpc('set_my_channel_settings',{p_channel:ch,p_ai_paused:paused,p_daily_limit:limit,p_extra:extra});
 btn.disabled=false;if(error)return toast(error.message,true);toast('Saved');load()}
async function disc(ch,btn){
 const name=CHANNELS.find(c=>c.key===ch).name;
 if(!confirm(`Disconnect ${name}? GLIME will stop sending and receiving on it. Your saved data is not deleted. You can reconnect later.`))return;
 btn.disabled=true;const{error}=await sb.rpc('disconnect_my_channel',{p_channel:ch});
 if(error){btn.disabled=false;return toast(error.message,true)}toast(name+' disconnected');load()}
(async()=>{
 const{data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return}
 const{data:c}=await sb.from('client_data').select('business_name,name').eq('auth_user_id',session.user.id).maybeSingle();
 if(c)$('biz').textContent=c.business_name||c.name||'GLIME';load()})();
</script></body></html>
