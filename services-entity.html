<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLIME — Choose what you manage</title>
  <link rel="stylesheet" href="services-entity.css">
</head>
<body>
  <main class="wizard-shell">
    <header class="topbar">
      <a class="brand" href="services.html" aria-label="GLIME home">
        <img class="brand-logo" src="glime_logo_clean.svg" alt="GLIME">
      </a>
      <div class="step-count">STEP 5</div>
    </header>

    <section class="wizard-card">
      <div class="eyebrow">BUSINESS SETUP</div>
      <h1>What do you want to manage?</h1>
      <p class="intro">Choose a ready-made type or create your own.</p>

      <div id="selection-context" class="context-card" hidden></div>

      <div id="loading-state" class="state-message">Loading available options…</div>
      <div id="error-state" class="state-message error" hidden></div>

      <section id="system-section" hidden>
        <div class="section-heading">
          <h2>Available options</h2>
          <p>Based on the structure you selected.</p>
        </div>
        <div id="system-entities" class="option-list"></div>
      </section>

      <section class="custom-section">
        <button id="custom-trigger" class="option-card custom-trigger" type="button">
          <span class="option-icon">＋</span>
          <span>
            <strong>Create a custom type</strong>
            <small>Use your own name for what you manage.</small>
          </span>
        </button>

        <form id="custom-form" class="custom-form" hidden>
          <label for="custom-name">Type name</label>
          <input
            id="custom-name"
            name="custom-name"
            type="text"
            maxlength="120"
            placeholder="e.g. Coaching Program"
            autocomplete="off"
          >

          <label for="custom-description">
            Description <span>(optional)</span>
          </label>
          <textarea
            id="custom-description"
            name="custom-description"
            maxlength="500"
            rows="4"
            placeholder="Briefly describe what this type represents."
          ></textarea>

          <div class="custom-actions">
            <button id="custom-cancel" class="secondary-button" type="button">
              Cancel
            </button>
            <button id="custom-use" class="primary-button" type="submit">
              Use this type
            </button>
          </div>
        </form>
      </section>

      <div class="footer-actions">
        <button id="back-button" class="secondary-button" type="button">
          Back
        </button>
        <button id="next-button" class="primary-button" type="button" disabled>
          Continue
        </button>
      </div>
    </section>
  </main>

  <script src="services-entity.js"></script>
</body>
</html>
