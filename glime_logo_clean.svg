<style>
/* GLIME logo - 5 different premium animations, one every 5 seconds (25s loop).
   0-5s   1 Classic draw   : G draws itself, nodes pop bottom to top, wordmark rises
   5-10s  2 Reverse draw   : G draws from the opposite end, nodes ease in, wordmark fades up
   10-15s 3 Cascade drop   : strokes draw fast, nodes drop in from above, wordmark zooms softly in
   15-20s 4 Soft bloom     : everything blooms in with a gentle fade, nodes pulse once
   20-25s 5 Draw and erase : G draws, rests, then erases itself along the same path
   Each scene ends with a gentle fade-out so the next one starts clean. */
.gl-path { stroke-dasharray: 1; stroke-dashoffset: 0; }
.gl-p2 { animation: gl-p2 25s linear infinite; }
.gl-p1 { animation: gl-p1 25s linear infinite; }
.gl-p3 { animation: gl-p3 25s linear infinite; }

.gl-node { transform-box: fill-box; transform-origin: center; }
.gl-n1 { animation: gl-n1 25s linear infinite; }
.gl-n2 { animation: gl-n2 25s linear infinite; }
.gl-n3 { animation: gl-n3 25s linear infinite; }

.gl-word { animation: gl-word 25s linear infinite; }

