<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox | GLIME</title>
<link rel="icon" type="image/svg+xml" href="glime_logo_clean.svg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="inbox.css?v=3">
<link rel="stylesheet" href="glime-app-shell.css">
<script src="glime-app-shell.js" defer></script>
</head>
<body data-gas-title="Inbox">
<div id="loadingScreen" class="loading-screen">
  <div class="spinner"></div>
  <div>Loading Inbox…</div>
</div>

<main class="ib-main" data-gas-content>
  <header class="ib-header">
    <div class="ib-title">
      <h1>Shared Inbox</h1>
      <p>WhatsApp and Instagram side by side, with who answered each message.</p>
    </div>
    <div class="ib-tools">
      <input id="searchInput" class="ib-search" type="search" placeholder="Search name, phone, message…" aria-label="Search conversations" autocomplete="off">
      <button id="refreshBtn" class="ib-btn" type="button">↻ Refresh</button>
    </div>
  </header>

  <div id="ibError" class="ib-error hidden" role="alert"></div>

  <div class="ib-layout" id="layout">

    <!-- WhatsApp -->
    <section class="ib-pane" data-ch="whatsapp" aria-label="WhatsApp conversations">
      <header class="ib-pane-head">
        <i class="ib-chdot ch-whatsapp" aria-hidden="true"></i>
        <h2>WhatsApp</h2>
        <span class="ib-count" data-role="count">0</span>
        <span class="ib-need" data-role="need"></span>
      </header>
      <div class="ib-pane-body">
        <div class="ib-plist" data-role="list"></div>
        <div class="ib-pchat" data-role="chat">
          <div class="ib-chat-head" data-role="head"></div>
          <div class="ib-thread" data-role="thread" aria-live="polite"></div>
          <div class="ib-readonly">View only. Replies are sent by your GLIME AI agents.</div>
        </div>
      </div>
    </section>

    <!-- Instagram -->
    <section class="ib-pane" data-ch="instagram" aria-label="Instagram conversations">
      <header class="ib-pane-head">
        <i class="ib-chdot ch-instagram" aria-hidden="true"></i>
        <h2>Instagram</h2>
        <span class="ib-count" data-role="count">0</span>
        <span class="ib-need" data-role="need"></span>
      </header>
      <div class="ib-pane-body">
        <div class="ib-plist" data-role="list"></div>
        <div class="ib-pchat" data-role="chat">
          <div class="ib-chat-head" data-role="head"></div>
          <div class="ib-thread" data-role="thread" aria-live="polite"></div>
          <div class="ib-readonly">View only. Replies are sent by your GLIME AI agents.</div>
        </div>
      </div>
    </section>

  </div>
</main>

<script src="inbox.js?v=3"></script>
</body>
</html>
