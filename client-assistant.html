<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <title>GLIME Client Assistant</title>
  <link rel="icon" type="image/svg+xml" href="glime_logo_clean.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="client-assistant.css">
  <style id="assistant-message-proposal-styles">
    /* Messaging proposal (assistant_message.v1) + delivery status */
    .msg-proposal{border-color:rgba(11,143,140,.25)}
    .mp-kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;align-items:baseline;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
    .mp-kv .label{margin:0}
    .mp-kv strong{overflow-wrap:anywhere;font-size:14px}
    .mp-recipients{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
    .mp-recipients li{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow-wrap:anywhere;font-size:14px}
    .mp-row{margin-top:12px;overflow-wrap:anywhere}
    .mp-message{margin-top:4px;padding:10px 12px;border:1px solid rgba(20,241,160,.4);border-radius:12px;background:rgba(20,241,160,.07);white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font-size:14px;line-height:1.55}
    .mp-meta{margin-top:6px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
    .mp-warn{margin-top:12px;padding:9px 11px;border:1px solid rgba(192,57,43,.22);border-radius:11px;background:rgba(192,57,43,.06);color:var(--danger);font-size:12.5px}
    .msg-outcome{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-2)}
    .msg-results{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
    .msg-results li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px}
    .msg-results li span{min-width:0;overflow-wrap:anywhere}
    .msg-results li b{flex:0 0 auto;font-size:12px;color:#0a6b57}
    .msg-results li b.is-bad{color:var(--danger)}
    @media (max-width:720px){.card-actions .btn{flex:1 1 0}.mp-kv{grid-template-columns:1fr;gap:2px}.mp-kv strong{margin-bottom:6px}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-newchat" viewBox="0 0 24 24"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"/><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M20 16l-5-5-8 8"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M7 8h10v4a5 5 0 0 1-10 0z"/><path d="M12 17v4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M4 20h16M5.5 14.5l8-8a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 18H8z"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/></symbol>
  </defs>
</svg>

<div class="assistant-app" id="assistantApp">

  <!-- Header -->
  <header class="app-header">
    <button id="conversationMenuBtn" class="icon-btn" type="button" aria-label="Open conversations" aria-expanded="false" aria-controls="conversationDrawer">
      <svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg>
    </button>

    <div class="title-block">
      <div class="title-row">
        <span class="ai-avatar" aria-hidden="true"><img class="logo-mark" src="glime_logo_clean.svg" width="18" height="18" alt=""></span>
        <h1>GLIME Client Assistant</h1>
      </div>
      <div class="title-meta"><span class="online-dot" aria-hidden="true"></span><span>Secure · Online</span></div>
    </div>

    <div class="header-actions">
      <button id="newChatBtn" class="icon-btn" type="button" aria-label="New chat" title="New chat">
        <svg class="ic" aria-hidden="true"><use href="#i-newchat"/></svg>
      </button>
      <button id="moreMenuBtn" class="icon-btn" type="button" aria-label="More options" aria-expanded="false" aria-controls="moreMenu">
        <svg class="ic" aria-hidden="true"><use href="#i-more"/></svg>
      </button>
    </div>
  </header>

  <!-- Chat -->
  <main class="assistant-main">
    <section id="conversationContainer" class="conversation" aria-label="Conversation">
      <div id="emptyState" class="empty-state">
        <div class="empty-mark" aria-hidden="true"><img class="logo-mark" src="glime_logo_clean.svg" width="34" height="34" alt=""></div>
        <h2>What can I help you with?</h2>
        <p>Ask about customers, leads, products, orders, appointments, performance, or other authorized business data.</p>
        <div class="suggestions" aria-label="Suggested questions">
          <button type="button" data-prompt="How many customers do I have?">Customer count</button>
          <button type="button" data-prompt="How much did I sell this month?">Monthly sales</button>
          <button type="button" data-prompt="How many leads do I have?">Lead count</button>
          <button type="button" data-prompt="What should my business focus on next?">Next step</button>
        </div>
      </div>

      <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"></div>

      <div id="thinkingIndicator" class="thinking-indicator" hidden role="status" aria-live="polite">
        <span class="thinking-logo" aria-hidden="true"><img class="logo-mark" src="glime_logo_clean.svg" width="20" height="20" alt=""></span>
        <span id="thinkingLabel" class="thinking-label">GLIME Thinking…</span>
        <span class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </section>
  </main>

  <!-- Composer -->
  <footer class="composer-dock">
    <div id="attachmentTray" class="attachment-tray" hidden aria-live="polite">
      <div id="attachmentList" class="attachment-list"></div>
    </div>

    <form id="chatForm" class="composer" novalidate>
      <button id="attachmentBtn" class="composer-icon-btn" type="button" aria-label="Open attachments and tools" aria-expanded="false" aria-controls="attachmentMenu">
        <svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg>
      </button>
      <div class="input-wrap">
        <textarea id="messageInput" maxlength="2000" rows="1" placeholder="Message GLIME" aria-label="Message GLIME Client Assistant" autocomplete="off" enterkeyhint="send"></textarea>
      </div>
      <button id="sendBtn" class="send-btn" type="submit" aria-label="Send message">
        <svg class="ic" aria-hidden="true"><use href="#i-send"/></svg>
      </button>
    </form>
    <div class="composer-foot"><span id="thinkingBadge" class="thinking-badge" hidden>GLIME Thinking on</span><span id="status" class="status" aria-live="polite"></span></div>
  </footer>

  <!-- Hidden file inputs: only types the backend accepts (PNG, JPEG, WebP, GIF, PDF) -->
  <input id="cameraInput" class="visually-hidden" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
  <input id="photosInput" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple tabindex="-1" aria-hidden="true">
  <input id="filesInput" class="visually-hidden" type="file" accept=".pdf,application/pdf" multiple tabindex="-1" aria-hidden="true">

  <!-- Overlays -->
  <div id="overlayBackdrop" class="backdrop" data-open="false"></div>

  <aside id="conversationDrawer" class="drawer" data-open="false" inert aria-label="Conversations">
    <div class="drawer-head">
      <div>
        <div class="eyebrow">GLIME</div>
        <h2>Conversations</h2>
      </div>
      <button id="closeDrawerBtn" class="icon-btn" type="button" aria-label="Close conversations"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <button id="drawerNewChatBtn" class="drawer-new" type="button"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span>New chat</span></button>
    <div id="conversationList" class="conversation-list" aria-live="polite"></div>
    <div class="drawer-foot">
      <button id="settingsBtn" class="menu-row" type="button"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg><span>Settings</span></button>
    </div>
  </aside>

  <div id="moreMenu" class="more-menu" data-open="false" inert role="menu" aria-label="Conversation actions">
    <button id="moreNewChatBtn" class="menu-row" type="button" role="menuitem"><svg class="ic" aria-hidden="true"><use href="#i-newchat"/></svg><span>New chat</span></button>
    <button id="renameConversationBtn" class="menu-row" type="button" role="menuitem"><svg class="ic" aria-hidden="true"><use href="#i-pencil"/></svg><span>Rename conversation</span></button>
    <button id="exportConversationBtn" class="menu-row" type="button" role="menuitem"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg><span>Export conversation</span></button>
    <button id="copyConversationBtn" class="menu-row" type="button" role="menuitem"><svg class="ic" aria-hidden="true"><use href="#i-copy"/></svg><span>Copy conversation</span></button>
    <button id="clearConversationBtn" class="menu-row" type="button" role="menuitem"><svg class="ic" aria-hidden="true"><use href="#i-eraser"/></svg><span>Clear current chat</span></button>
    <div class="menu-sep" role="separator"></div>
    <button id="deleteConversationBtn" class="menu-row is-destructive" type="button" role="menuitem"><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg><span>Delete conversation</span></button>
  </div>

  <section id="attachmentMenu" class="sheet" data-open="false" inert aria-label="Attachments and tools">
    <div class="sheet-handle" aria-hidden="true"></div>
    <button id="cameraBtn" class="tool-row" type="button"><span class="tool-icon"><svg class="ic" aria-hidden="true"><use href="#i-camera"/></svg></span><span class="tool-main"><strong>Camera</strong></span></button>
    <button id="photosBtn" class="tool-row" type="button"><span class="tool-icon"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg></span><span class="tool-main"><strong>Photos</strong><small>PNG, JPEG, WebP, GIF</small></span></button>
    <button id="filesBtn" class="tool-row" type="button"><span class="tool-icon"><svg class="ic" aria-hidden="true"><use href="#i-file"/></svg></span><span class="tool-main"><strong>Files</strong><small>PDF up to 4.5 MB</small></span></button>
    <button id="connectorBtn" class="tool-row" type="button"><span class="tool-icon"><svg class="ic" aria-hidden="true"><use href="#i-plug"/></svg></span><span class="tool-main"><strong>Connector</strong></span></button>
    <button id="glimeThinkingBtn" class="tool-row" type="button" aria-pressed="false" data-mode="glime-thinking">
      <span class="tool-icon"><img class="logo-mark" src="glime_logo_clean.svg" width="20" height="20" alt=""></span>
      <span class="tool-main"><strong>GLIME Thinking</strong><small>Enhanced reasoning mode</small></span>
      <span class="toggle" aria-hidden="true"></span>
    </button>
  </section>

  <div id="dialog" class="dialog" data-open="false" inert role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <h3 id="dialogTitle"></h3>
    <p id="dialogBody"></p>
    <input id="dialogInput" class="dialog-input" type="text" maxlength="80" autocomplete="off" aria-label="Conversation title" hidden>
    <div class="dialog-actions">
      <button id="dialogCancel" class="btn btn-secondary" type="button">Cancel</button>
      <button id="dialogConfirm" class="btn btn-primary" type="button">Confirm</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

<!-- Data-mutation proposal -->
<template id="proposalTemplate">
  <section class="card proposal" aria-label="Action proposal">
    <div class="card-head">
      <div class="eyebrow">ACTION PROPOSAL</div>
      <span class="badge" data-role="risk"></span>
    </div>
    <div class="proposal-target"><span class="label">Target</span><strong data-role="target"></strong></div>
    <div class="change-list" data-role="changes"></div>
    <p class="proposal-note" data-role="note">Nothing is changed until you explicitly approve this proposal.</p>
    <div class="card-actions" data-role="actions">
      <button type="button" class="btn btn-secondary" data-role="cancel">Reject</button>
      <button type="button" class="btn btn-primary" data-role="approve">Approve change</button>
    </div>
    <div class="card-status" data-role="status" aria-live="polite" hidden></div>
    <div data-role="execution" hidden></div>
  </section>
</template>

<!-- Execution lifecycle (data mutations) -->
<template id="executionTemplate">
  <div class="execution" aria-label="Execution status">
    <div class="card-head"><div class="eyebrow">EXECUTION STATUS</div><span class="badge" data-role="badge">Proposed</span></div>
    <ol class="steps">
      <li data-status="proposed"><i></i><span>Proposed</span></li>
      <li data-status="approved"><i></i><span>Approved</span></li>
      <li data-status="queued"><i></i><span>Queued</span></li>
      <li data-status="processing"><i></i><span>Processing</span></li>
      <li data-status="completed"><i></i><span>Completed</span></li>
    </ol>
    <div class="card-status" data-role="message" aria-live="polite"></div>
  </div>
</template>

<!-- AI credits exhausted -->
<template id="creditsTemplate">
  <section class="card credits" aria-live="assertive">
    <div class="eyebrow">AI CREDITS</div>
    <h3>Your AI credits are exhausted.</h3>
    <p>Please open Billing to continue using the Client Assistant.</p>
    <button type="button" class="btn btn-primary" data-ui-navigate="billing">Go to Billing</button>
  </section>
</template>

<script src="client-assistant.js"></script>
</body>
</html>
