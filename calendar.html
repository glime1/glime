function normPhone(v){
  const t=String(v||'').trim();if(!t)return{ok:true,empty:true,value:''};

/* ---------- Working hours, breaks and leave (same rules as the server) ---------- */
function dayInfo(rid,date){
  const dow=new Date(date+'T00:00:00').getDay();
  const lv=st.leave.find(o=>(!o.resource_id||o.resource_id===rid)&&date>=o.start_date&&date<=o.end_date);
  if(lv)return{open:false,why:'leave',note:lv.reason||'',whole:!lv.resource_id};
  const r=st.res.find(x=>x.id===rid);
  if(r&&r.custom_hours){const h=st.rh.find(x=>x.resource_id===rid&&x.day===dow);return h&&h.on?{open:true,a:toM(h.start),z:toM(h.end)}:{open:false,why:'off_day'};}
  const h=st.hours.find(x=>x.day===dow);return h&&h.on?{open:true,a:toM(h.start),z:toM(h.end)}:{open:false,why:'closed'};
}
function brks(rid,date){const dow=new Date(date+'T00:00:00').getDay();return st.brk.filter(b=>(!b.resource_id||b.resource_id===rid)&&(b.day==null||b.day===dow));}
function blockReason(rid,date,time,dur){
  const w=dayInfo(rid,date),a=toM(time),z=a+dur,who=resOf(rid).name;
  if(!w.open)return w.why==='leave'?(w.whole?'The clinic is closed on this date.':who+' is on leave on this date.'):w.why==='off_day'?who+' does not work on this day.':'The clinic is closed on this day.';
  if(a<w.a||z>w.z)return 'This time is outside working hours ('+fm(w.a)+' to '+fm(w.z)+').';
  const b=brks(rid,date).find(x=>a<toM(x.end)&&z>toM(x.start));
  return b?'This time falls in a break: '+b.label+' ('+fm(toM(b.start))+' to '+fm(toM(b.end))+').':'';
}
const minDur=()=>{const d=st.svc.filter(s=>s.agent!==false).map(s=>+s.duration).filter(Boolean);return d.length?Math.min(...d):15;};
function gaps(rid,date){
  const w=dayInfo(rid,date);if(!w.open)return[];let a=w.a,z=w.z;
  if(date===T()){const n=new Date();a=Math.max(a,Math.ceil((n.getHours()*60+n.getMinutes())/5)*5);}
  const busy=st.bk.filter(x=>x.resource_id===rid&&x.status!=='cancelled'&&dayOf(x)===date).map(x=>[mins(x.start),mins(x.end)]).concat(brks(rid,date).map(b=>[toM(b.start),toM(b.end)])).sort((p,q)=>p[0]-q[0]),md=minDur(),out=[];let c=a;
  busy.forEach(([s,e])=>{if(s-c>=md)out.push([c,s]);c=Math.max(c,e);});
  if(z-c>=md)out.push([c,z]);return out;
}
function busyPct(rid,date){
  const w=dayInfo(rid,date);if(!w.open)return null;
  let tot=w.z-w.a;brks(rid,date).forEach(b=>{tot-=Math.max(0,Math.min(toM(b.end),w.z)-Math.max(toM(b.start),w.a));});
  if(tot<=0)return 100;let b=0;
  st.bk.forEach(x=>{if(x.resource_id===rid&&x.status!=='cancelled'&&dayOf(x)===date)b+=Math.max(0,Math.min(mins(x.end),w.z)-Math.max(mins(x.start),w.a));});
  return Math.min(100,Math.round(b/tot*100));
}
function nextRem(){const n=Date.now();let best=null;st.bk.filter(x=>x.status==='confirmed'||x.status==='booked').forEach(x=>{[[24,'reminder_24h'],[1,'reminder_1h']].forEach(([h,k])=>{if(!st.set[k])return;const t=+new Date(x.start)-h*36e5;if(t>n&&(!best||t<best.t))best={t,x,h};});});return best;}
function dayNotes(){
  const out=[];let clinic=false;
  st.res.forEach(r=>{
    if(st.rf&&st.rf!==r.id)return;const w=dayInfo(r.id,st.date);if(w.open)return;
    if(w.why==='closed'||(w.why==='leave'&&w.whole)){clinic=true;return;}
    out.push(w.why==='leave'?esc(r.name)+' is on leave today'+(w.note?' ('+esc(w.note)+')':'')+'.':esc(r.name)+' does not work today.');
  });
  if(clinic)out.unshift('The clinic is closed today. You can still view past bookings.');
  return out.length?`<div class="note am">${out.join('<br>')}</div>`:'';
}

function tlView(day){
  const rs=st.rf?st.res.filter(r=>r.id===st.rf):st.res;
  let s0=9,e0=19;const wins=rs.map(r=>dayInfo(r.id,st.date)).filter(w=>w.open);
  if(wins.length){s0=Math.floor(Math.min(...wins.map(w=>w.a))/60);e0=Math.min(24,Math.ceil(Math.max(...wins.map(w=>w.z))/60));}
  day.forEach(x=>{s0=Math.min(s0,new Date(x.start).getHours());e0=Math.max(e0,Math.min(24,new Date(x.end).getHours()+1));});
  st.s0=s0;const n=Math.max(1,e0-s0),H=n*PPH,nd=new Date(),nowTop=((nd.getHours()-s0)*60+nd.getMinutes())*PPH/60;
  const gut=Array.from({length:n},(_,i)=>`<span style="top:${i*PPH}px">${pad(s0+i)}:00</span>`).join('');
  const px=m=>(m-s0*60)*PPH/60;
  const cols=rs.map(r=>{
    const w=dayInfo(r.id,st.date);let bands='';
    if(!w.open)bands=`<div class="band" style="top:0;height:${H}px">${w.why==='leave'?'On leave':'Closed'}</div>`;
    else{
      if(px(w.a)>0)bands+=`<div class="band" style="top:0;height:${px(w.a)}px">Closed</div>`;
      if(px(w.z)<H)bands+=`<div class="band" style="top:${px(w.z)}px;height:${H-px(w.z)}px">Closed</div>`;

let histSeq=0,suggSeq=0,suggTimer=0,findTimer=0,findSeq=0;
function paintHist(){const e=$app.querySelector('#hist');if(e)e.innerHTML=histHtml();}

function paintTpl(){

async function loadTpl(){
  try{st.tpl=await api('template.list');if(st.tpl&&st.tpl.items){const lang=st.tpl.language;if(lang==='hi'||lang==='en'){if(!st.tplTouched){st.tplLang=lang;}}}}
  catch(e){st.tpl={connected:false,items:[],error:e.message};}

async function sendTemplates(kinds){
  const ok=await ask('Send for approval?','Meta reviews the text before it can be used. This usually takes a few minutes to a few hours. Reminders start using it automatically once it is approved.','Send for approval');
  if(!ok)return;
  st.tplBusy=true;render();
  try{
    for(const k of kinds){await api('template.create',{kind:k,body:st.tplText[k],language:st.tplLang,all:kinds.length>1});}
    st.set=await api('settings.get');st.set.industry=st.set.industry||'general';
    toast('ok',kinds.length>1?'All 3 templates were sent to Meta for approval.':'Template sent to Meta for approval.');
  }catch(e){console.error(e);toast('err',e.message||'Could not send the template.');}
  st.tplBusy=false;st.tpl=null;render();await loadTpl();
}
$app.addEventListener('click',async e=>{

  if(a==='slotclick'){if(!st.svc.length)return fail('Add a service in Setup first.');const y=e.clientY-b.getBoundingClientRect().top,m=st.s0*60+Math.floor(y/PPH*4)*15;return open('bk',emptyBk(b.dataset.r,pad(Math.floor(m/60))+':'+pad(m%60)));}
  if(a==='open'){const x=st.bk.find(v=>v.id===b.dataset.id);return x?open('bk',editBk(x)):0;}
  if(a==='found'){const x=(st.found||[]).find(v=>v.id===b.dataset.id);return x?open('bk',editBk(x)):0;}
  if(a==='found-day'){const x=(st.found||[]).find(v=>v.id===b.dataset.id);if(!x)return;st.q='';st.found=null;st.date=dayOf(x);return run(async()=>{await loadWeek();});}
  if(a==='mact'){
    const x=st.bk.find(v=>v.id===b.dataset.id),v=b.dataset.v;st.menu=null;if(!x)return render();
    if(v==='edit')return open('bk',editBk(x));if(v==='resched')return open('bk',editBk(x,'resched'));
    if(v==='remind')return run(async()=>{await api('booking.remind',{id:x.id});await loadAct();},'WhatsApp reminder sent to '+x.customer+'.');
    if(v==='delete'){if(!await ask('Delete permanently?','This removes the cancelled appointment of '+x.customer+' from your history. This cannot be undone.','Delete',true))return render();return run(async()=>{await api('booking.delete',{id:x.id});await loadWeek();},'Appointment deleted.');}
    if(v==='cancelled'&&!await ask('Cancel this appointment?',x.customer+' · '+tm(x.start)+'. This frees the time slot. Nothing is sent to the '+L().c.toLowerCase()+' automatically.','Yes, cancel',true))return render();
    return run(async()=>{await api('booking.status',{id:x.id,status:v});await Promise.all([loadWeek(),loadPend()]);},'Status updated.');
  }
  if(a==='close'){st.sheet=null;return render();}
  if(a==='sheet-remind'){return run(async()=>{await api('booking.remind',{id:sh.d.id});},'WhatsApp reminder sent.');}
  if(a==='slot'){sh.d={...sh.d,...readF(),time:b.dataset.t};return render();}
  if(a==='color'){sh.d={...sh.d,...readF(),color:b.dataset.c};return render();}

  if(a==='decline'){const x=st.pend.find(v=>v.id===b.dataset.id);if(!await ask('Decline this request?',(x?x.customer+' · ':'')+'The time slot is freed. Nothing is sent to them automatically.','Decline',true))return;return run(async()=>{await api('booking.status',{id:b.dataset.id,status:'cancelled'});await Promise.all([loadWeek(),loadPend()]);},'Request declined.');}
  if(a==='add-res')return open('res',newRes());
  if(a==='edit-res'){const r=st.res.find(x=>x.id===b.dataset.id);return r?open('res',resSheet(r)):0;}
  if(a==='add-svc')return open('svc',{id:null,name:'',duration:15,buffer:0,price:0,info:'',agent:true});
  if(a==='edit-svc')return open('svc',{info:'',agent:true,...st.svc.find(s=>s.id===b.dataset.id)});
  if(a==='add-brk')return open('brk',{id:null,label:'Lunch',resource_id:'',day:'',start:'13:00',end:'14:00'});
  if(a==='edit-brk'){const x=st.brk.find(v=>v.id===b.dataset.id);return x?open('brk',{...x,resource_id:x.resource_id||'',day:x.day==null?'':x.day}):0;}
  if(a==='add-off')return open('off',{id:null,resource_id:'',start_date:st.date,end_date:st.date,reason:''});
  if(a==='edit-off'){const x=st.leave.find(v=>v.id===b.dataset.id);return x?open('off',{...x,resource_id:x.resource_id||'',reason:x.reason||''}):0;}
  if(a==='del-res'||a==='del-svc'||a==='del-brk'||a==='del-off'||a==='del-sheet'){
    const k=a==='del-sheet'?sh.k:a==='del-res'?'res':a==='del-svc'?'svc':a==='del-brk'?'brk':'off',id=a==='del-sheet'?sh.d.id:b.dataset.id;
    const T2={bk:['Delete permanently?','This removes the cancelled appointment from your history. This cannot be undone.'],res:['Delete this '+L().r.toLowerCase()+'?','Their past appointments stay in your history. You must cancel or move upcoming ones first.'],svc:['Delete this service?','Existing bookings stay in your calendar. The AI agent will stop offering it.'],brk:['Delete this break?','Patients can be booked in this time again.'],off:['Delete this leave?','Patients can be booked on these days again.']}[k];
    if(!await ask(T2[0],T2[1],'Delete',true))return;
    return run(async()=>{
      if(k==='bk'){await api('booking.delete',{id});await loadWeek();}
      else if(k==='res'){await api('resource.delete',{id});await loadSetup();}
      else if(k==='svc'){await api('service.delete',{id});await loadSetup();}
      else if(k==='brk'){await api('break.delete',{id});await loadSetup();}
      else{await api('timeoff.delete',{id});await loadSetup();}
      st.sheet=null;},'Deleted.');
  }
  if(a==='save'){
    const d={...sh.d,...readF()};sh.d=d;
    if(sh.k==='bk'){

      if(!d.time)return fail('Choose a time from the free times, or type one.');
      const ph=normPhone(d.phone);if(!ph.ok)return fail(ph.msg);
      const sv=svcOf(d.service_id),dur=(sv&&+sv.duration)||15,s0=new Date(d.date+'T'+d.time+':00'),e0=new Date(+s0+dur*6e4);
      const old=d.id?st.bk.find(x=>x.id===d.id)||(st.found||[]).find(x=>x.id===d.id):null;
      const changed=!old||old.resource_id!==d.resource_id||old.service_id!==d.service_id||dayOf(old)!==d.date||hm(old.start)!==d.time;
      if(changed&&!['cancelled','completed','no_show'].includes(d.status)){const br=blockReason(d.resource_id,d.date,d.time,dur);if(br)return fail(br);}
      const hit=d.status==='cancelled'?null:st.bk.find(x=>x.id!==d.id&&x.resource_id===d.resource_id&&x.status!=='cancelled'&&new Date(x.start)<e0&&new Date(x.end)>s0);
      if(hit)return fail('Double booking: '+hit.customer+' already has '+tm(hit.start)+' with '+resOf(hit.resource_id).name+'. Pick a free time.');
      return run(async()=>{await api('booking.save',{id:d.id||undefined,resource_id:d.resource_id,service_id:d.service_id,customer:d.customer.trim(),phone:ph.value,date:d.date,time:d.time,status:d.status,notes:(d.notes||'').trim()});st.sheet=null;st.date=d.date;await Promise.all([loadWeek(),loadPend()]);},d.id?'Changes saved.':'Booking created.');
    }
    if(sh.k==='brk'){
      if(!d.start||!d.end||d.end<=d.start)return fail('The break must end after it starts.');
      return run(async()=>{await api('break.save',{id:d.id||undefined,resource_id:d.resource_id||null,day:d.day===''||d.day==null?null:+d.day,start:d.start,end:d.end,label:(d.label||'').trim()||'Break'});await loadSetup();st.sheet=null;},'Break saved.');

      if(!d.start_date)return fail('Choose the first day.');const end=d.end_date||d.start_date;
      if(end<d.start_date)return fail('The last day cannot be before the first day.');
      return run(async()=>{const r=await api('timeoff.save',{id:d.id||undefined,resource_id:d.resource_id||null,start_date:d.start_date,end_date:end,reason:(d.reason||'').trim()});await loadSetup();await loadWeek();st.sheet=null;
        return r&&r.affected?'Leave saved. '+r.affected+' existing appointment'+(r.affected>1?'s fall':' falls')+' in this period. They were not cancelled, so please move or cancel them.':'Leave saved.';});
    }
    if(!(d.name||'').trim())return fail('Enter a name.');
    if(sh.k==='res'){
      const hrs=d.hrs||[];
      if(d.custom){const bad=hrs.find(h=>h.on&&(!h.start||!h.end||h.end<=h.start));if(bad)return fail(DAYS[bad.day]+': end time must be after start time.');if(!hrs.some(h=>h.on))return fail('Tick at least one working day, or switch off “Own timings”.');}

  }
  if(a==='hrs-save'){

    return run(async()=>{await api('settings.save',v);Object.assign(st.set,v);},'Saved.');
  }
  if(a==='tpl-send')return sendTemplates([b.dataset.k]);

$app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='ind')return run(async()=>{await api('settings.save',{industry:t.value});st.set.industry=t.value;},'Business type updated.');

  if(t.matches('.sh [data-re]')&&st.sheet){st.sheet.d={...st.sheet.d,...readF()};return run(loadSlots);}

});
function paintHint(){const t=$app.querySelector('.sh [data-f=phone]'),h=$app.querySelector('#phHint');if(!t||!h)return;const x=hintHtml(t.value);h.className='hint '+x.c;h.textContent=x.t;}
function pickSugg(t){
  const hit=(st.sugg||[]).find(s=>suggLabel(s)===t.value);if(!hit)return;
  t.value=hit.name;const ph=$app.querySelector('.sh [data-f=phone]');if(ph)ph.value=hit.phone?fmtPhone(hit.phone):'';
  if(st.sheet)st.sheet.d={...st.sheet.d,customer:hit.name,phone:ph?ph.value:''};
  paintHint();loadHist();
}
$app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){
    st.q=t.value;clearTimeout(findTimer);const q=st.q.trim();
    if(q.length<2){st.found=null;st.finding=false;render();const i=$app.querySelector('#q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}return;}
    st.finding=true;updLst();
    const my=++findSeq;
    findTimer=setTimeout(async()=>{try{const r=await api('bookings.search',{q});if(my!==findSeq)return;st.found=r.items||[];}catch(x){if(my!==findSeq)return;st.found=[];toast('err',x.message||'Search failed.');}st.finding=false;updLst();},300);
    return;
  }
  if(t.matches('.sh [data-f=customer]')){
    if((st.sugg||[]).find(s=>suggLabel(s)===t.value))return pickSugg(t);
    clearTimeout(suggTimer);const v=t.value.trim();if(v.length<2)return;
    suggTimer=setTimeout(async()=>{const my=++suggSeq;try{const r=await api('patients.search',{q:v});if(my!==suggSeq||!st.sheet)return;st.sugg=(r.items||[]).filter(x=>x.phone);const dl=$app.querySelector('#gcSugg');if(dl)dl.innerHTML=st.sugg.map(s=>`<option value="${esc(suggLabel(s))}"></option>`).join('');}catch(x){}},250);
    return;
  }
  if(t.matches('.sh [data-f=phone]')){if(st.sheet)st.sheet.d.phone=t.value;paintHint();return;}
  if(t.matches('[data-tpl]')){st.tplText[t.dataset.tpl]=t.value;return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('.gcov')&&(st.sheet||st.menu)){st.sheet=null;st.menu=null;render();}});
async function agentTest(){
  const sv=$app.querySelector('#t-s').value,rs=$app.querySelector('#t-r').value,date=$app.querySelector('#t-d').value;
  if(!sv||!rs||!date)return fail('Add a service and a '+L().r.toLowerCase()+' first.');
  const lines=[];const out=()=>{st.log=lines.join('\n');const el=$app.querySelector('#log');if(el)el.innerHTML=st.log;};
  try{
    lines.push('<b>customer</b> I want to book on '+esc(date));out();
    lines.push('<b>tool</b> check_availability');out();
    const sl=(await api('availability.check',{resource_id:rs,service_id:sv,date,as:'agent'})).slots||[];
    lines.push('<em>result</em> '+(sl.length?sl.length+' free times, first '+sl[0]:'no free times'));out();
    if(!sl.length){lines.push('<b>agent</b> Sorry, nothing is free that day. Shall I check another day?');out();return;}
    lines.push('<b>tool</b> create_booking '+sl[0]);out();
    await api('booking.save',{resource_id:rs,service_id:sv,customer:'Agent test',phone:'',date,time:sl[0],status:st.set.auto_confirm?'confirmed':'pending',notes:'Created by test run',source:'ai_whatsapp'});
    lines.push('<em>result</em> '+(st.set.auto_confirm?'booking confirmed':'booking held for approval'));out();
    lines.push('<b>agent</b> You are booked for '+esc(date)+' at '+sl[0]+'.');out();
    await refreshAll();st.log=lines.join('\n');toast('ok','Test booking created. Cancel and delete it from the Calendar when done.');render();
  }catch(e){console.error(e);toast('err',e.message||'Test failed.');render();}
}

/* ---------- Live refresh: new AI bookings appear without reloading; the date rolls over at midnight ---------- */
let busyTick=false;
async function tick(){
  if(busyTick||document.hidden||st.loading||st.disabled||st.fail)return;
  const nowT=T();let rolled=false;
  if(nowT!==st.lastToday){if(st.date===st.lastToday)st.date=nowT;st.lastToday=nowT;rolled=true;}
  if(st.tab!=='cal'||st.sheet||st.menu||st.q.trim()||document.querySelector('.gcov'))return rolled?(render(),undefined):undefined;
  const ae=document.activeElement;if(ae&&$app.contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
  busyTick=true;
  try{
    const sig=()=>JSON.stringify(st.bk.map(x=>[x.id,x.status,x.start,x.resource_id,x.customer]))+JSON.stringify(st.pend.map(x=>x.id));
    const before=sig();await refreshAll();
    if(rolled||sig()!==before)render();
    else{const u=$app.querySelector('#upd');if(u&&st.upd)u.textContent='Live · updated '+tm(st.upd);}
  }catch(e){console.warn('Live refresh skipped:',e&&e.message);}
  busyTick=false;
}
setInterval(tick,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
window.addEventListener('focus',tick);
const wk=d=>addD(d,-new Date(d+'T00:00:00').getDay());

/* ---------- Init ---------- */
async function init(){
  try{
    if(!sb)throw new Error('Could not start the calendar. Reload the page.');
    const ses=await sb.auth.getSession(),user=ses&&ses.data&&ses.data.session&&ses.data.session.user;
    if(!user){location.replace('login.html');return;}
    st.uid=user.id;
    /* The Calendar connector switch is saved in this browser and on the server, so other phones and computers see it too. */
    let on=false;try{on=localStorage.getItem(KEY+user.id)==='1';}catch(e){}
    let srv=null;try{srv=(await api('connector.get')).enabled;}catch(e){}
    if(srv===true){on=true;try{localStorage.setItem(KEY+user.id,'1');}catch(e){}}
    else if(srv===false){on=false;try{localStorage.removeItem(KEY+user.id);}catch(e){}}
    else if(on)api('connector.set',{enabled:true}).catch(()=>{});
    if(!on){st.disabled=true;st.loading=false;render();return;}
    await loadSetup();
    st.set={industry:'general',...(await api('settings.get'))};
    await Promise.all([loadWeek(),loadPend()]);try{await loadAct();}catch(e){}
  }catch(e){console.error(e);st.fail=e.message||'Calendar could not be loaded.';}
  st.loading=false;render();
}
init();
})();
