<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLIME Billing</title>
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--panel2:#111f33;--text:#f5f7fb;--muted:#93a4ba;--line:#20314a;--accent:#8b5cf6;--accent2:#6d28d9;--good:#22c55e;--warn:#f59e0b;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#050b14,#081525);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:42px;object-fit:contain}.brand b{font-size:22px}.brand span{display:block;color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#101d30;color:var(--text);padding:10px 15px;border-radius:10px;cursor:pointer}.btn.primary{background:var(--accent2);border-color:var(--accent)}.btn.danger{border-color:#71333a;color:#ffb5bc}.grid{display:grid;gap:16px}.plans{grid-template-columns:repeat(3,1fr)}.card{background:rgba(13,26,43,.94);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 12px 35px rgba(0,0,0,.16)}.card h2,.card h3{margin:0 0 8px}.muted{color:var(--muted)}.price{font-size:30px;font-weight:800;margin:14px 0}.price small{font-size:13px;color:var(--muted);font-weight:500}.toggle{display:flex;justify-content:center;margin:0 0 18px}.toggle button{padding:9px 18px;border:1px solid var(--line);background:#0b1727;color:var(--muted);cursor:pointer}.toggle button:first-child{border-radius:10px 0 0 10px}.toggle button:last-child{border-radius:0 10px 10px 0}.toggle .active{background:var(--accent2);color:white}.features{padding-left:18px;color:#dbe5f2;line-height:1.9}.section{margin-top:18px}.cols{grid-template-columns:1fr 1fr}.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(32,49,74,.7)}.bar{height:8px;background:#18283d;border-radius:99px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:var(--accent)}.actions{display:flex;gap:8px;flex-wrap:wrap}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(32,49,74,.65)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#17263b;color:#cbd7e8;font-size:12px}.notice{padding:12px 14px;border-radius:12px;background:#10233a;border:1px solid var(--line);margin-bottom:14px}.hidden{display:none}@media(max-width:850px){.plans,.cols{grid-template-columns:1fr}.top{align-items:flex-start}.price{font-size:26px}}</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><img src="glime_logo_clean.svg" alt="GLIME"><div><b>GLIME</b><span>Billing & Usage</span></div></div><button class="btn" id="refresh">Refresh</button></header>
<div id="notice" class="notice hidden"></div>
<section class="card" id="subscription"><h2>Current subscription</h2><div id="subBody" class="muted">Loading…</div></section>
<section class="section"><div class="toggle"><button id="monthly" class="active">Monthly</button><button id="yearly">Yearly</button></div><div id="plans" class="grid plans"></div></section>
<section class="section grid cols">
<div class="card"><h3>Business Data</h3><div id="dataAddons" class="muted">Loading…</div></div>
<div class="card"><h3>AI Credits</h3><div id="credits" class="muted">Loading…</div><div class="actions" style="margin-top:12px"><button class="btn primary" data-action="buy-credits">Add AI Credits</button></div></div>
</section>
<section class="section grid cols">
<div class="card"><h3>Wallet</h3><div id="wallet" class="muted">Loading…</div><div class="actions" style="margin-top:12px"><button class="btn primary" data-action="wallet">Add Wallet Balance</button></div></div>
<div class="card"><h3>Usage</h3><div id="usage" class="muted">Loading…</div></div>
</section>
<section class="section card"><h3>Agents & access</h3><div id="agents" class="muted">Loading…</div></section>
<section class="section card"><h3>Payment history</h3><div id="payments" class="muted">Loading…</div></section>
<section class="section card"><h3>Invoices</h3><div id="invoices" class="muted">Loading…</div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* GLIME billing UI is catalog-driven. Prices, quotas, entitlements and balances are never authoritative in this file. */
const SUPABASE_URL=window.GLIME_SUPABASE_URL||'';
const SUPABASE_ANON_KEY=window.GLIME_SUPABASE_ANON_KEY||'';
let sb=null,state={catalog:null,subscription:null,usage:null,credits:null,wallet:null,agents:null,payments:null,invoices:null,cycle:'monthly'};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(v,c='INR'){if(v==null)return '—';return new Intl.NumberFormat('en-IN',{style:'currency',currency:c,maximumFractionDigits:2}).format(Number(v))}
function bytes(v){if(v==null)return '—';let n=Number(v);const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n>=100||i===0?n.toFixed(0):n.toFixed(1)} ${u[i]}`}
function pct(u,q){u=Number(u)||0;q=Number(q)||0;return q?Math.min(100,u/q*100):0}
async function fn(name,body={}){if(!sb)throw Error('GLIME configuration missing');const {data,error}=await sb.functions.invoke(name,{body});if(error)throw error;return data}
function setNotice(msg){const n=document.getElementById('notice');n.textContent=msg;n.classList.remove('hidden')}
async function load(){try{if(!SUPABASE_URL||!SUPABASE_ANON_KEY){setNotice('GLIME billing configuration is not connected yet.');return}sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const [catalog,sub,cap]=await Promise.all([fn('glime-billing-catalog'),fn('glime-billing-my-subscription'),fn('glime-billing-get-capacity').catch(()=>null)]);state.catalog=catalog;state.subscription=sub;state.capacity=cap;render()}catch(e){setNotice('Billing information could not be loaded. Please refresh and try again.');console.error(e)}}
function render(){renderSub();renderPlans();renderAddons();renderCredits();renderWallet();renderUsage();renderAgents();renderPayments();renderInvoices()}
function renderSub(){const x=state.subscription||{};const s=x.subscription||x.current_subscription||x;document.getElementById('subBody').innerHTML=`<div class="stat"><span>Plan</span><b>${esc(s.plan_name||s.plan||'Free')}</b></div><div class="stat"><span>Status</span><span class="badge">${esc(s.status||'active')}</span></div><div class="stat"><span>Billing cycle</span><span>${esc(s.billing_cycle||s.cycle||'—')}</span></div><div class="stat"><span>Renews / ends</span><span>${esc(s.current_period_end||s.ends_at||'—')}</span></div>${s.trial_ends_at?`<div class="stat"><span>Trial ends</span><span>${esc(s.trial_ends_at)}</span></div>`:''}<div class="actions" style="margin-top:14px"><button class="btn primary" data-action="manage">Change plan</button><button class="btn" data-action="cancel">Cancel</button><button class="btn" data-action="resume">Resume</button></div>`}
function plans(){let c=state.catalog||{};return c.plans||c.products||c.items||[]}
function renderPlans(){const arr=plans();document.getElementById('plans').innerHTML=arr.filter(p=>String(p.plan_code||p.code||'').toLowerCase()!=='free').map(p=>{const code=p.plan_code||p.code;const prices=p.prices||{};const pr=prices[state.cycle]??p[`${state.cycle}_price`]??p.price;return `<article class="card"><h2>${esc(p.name||p.plan_name||code)}</h2><div class="muted">${esc(p.description||'')}</div><div class="price">${money(pr)} <small>/ ${state.cycle}</small></div><ul class="features">${(p.features||p.entitlements||[]).map(f=>`<li>${esc(typeof f==='string'?f:(f.label||f.name||f.code))}</li>`).join('')}</ul><button class="btn primary" data-plan="${esc(code)}">Choose plan</button></article>`}).join('')||'<div class="card muted">Plans are loaded from the GLIME billing catalog.</div>'}
function renderAddons(){const a=(state.catalog?.addons||state.catalog?.add_ons||[]).filter(x=>String(x.type||x.entitlement_type||'').toLowerCase().includes('business')||String(x.code||'').includes('business_data'));document.getElementById('dataAddons').innerHTML=a.map(x=>`<div class="row"><div><b>${esc(x.name||x.code)}</b><div class="muted">${esc(x.description||'')}</div></div><div><b>${money(x.price??x.monthly_price)}</b><br><button class="btn" data-addon="${esc(x.code)}">Add</button></div></div>`).join('')||'Business Data options will appear here from the billing catalog.'}
function renderCredits(){const x=state.credits||state.subscription?.ai_credits||{};const rem=x.remaining_tokens??(x.balance_credits!=null?Number(x.balance_credits)*1000:null);const used=x.used_tokens;const total=x.total_tokens;const p=total?Math.min(100,Number(used)/Number(total)*100):0;document.getElementById('credits').innerHTML=`<div class="stat"><span>Remaining</span><b>${rem==null?'—':Number(rem).toLocaleString('en-IN')} AI tokens</b></div>${total?`<div class="bar"><i style="width:${p}%"></i></div>`:''}<div class="muted">1 GLIME Credit = 1,000 AI tokens. AI usage combines input + output tokens.</div>`}
function renderWallet(){const x=state.wallet||state.subscription?.wallet||{};document.getElementById('wallet').innerHTML=`<div class="stat"><span>Balance</span><b>${money(x.balance??x.wallet_balance)}</b></div><div class="muted">Minimum wallet top-up is determined by GLIME billing configuration.</div>`}
function renderUsage(){const u=state.usage||state.subscription?.usage||{};const rows=Array.isArray(u)?u:Object.entries(u).map(([k,v])=>({service:k,...(typeof v==='object'?v:{quantity:v})}));document.getElementById('usage').innerHTML=rows.length?rows.map(r=>`<div class="stat"><span>${esc(r.label||r.service||r.code)}</span><span>${esc(r.quantity??r.used??'0')} ${esc(r.unit||'')}</span></div>`).join(''):'Usage will appear here as activity is recorded.'}
function renderAgents(){const a=state.agents||state.subscription?.agents||state.subscription?.entitlements?.agents||[];document.getElementById('agents').innerHTML=Array.isArray(a)&&a.length?a.map(x=>`<div class="row"><span>${esc(typeof x==='string'?x:(x.name||x.code))}</span><span class="badge">${esc(typeof x==='string'?'Included':(x.status||'Included'))}</span></div>`).join(''):'Agent access is controlled by current GLIME entitlements.'}
function renderPayments(){const p=state.payments||state.subscription?.payments||[];document.getElementById('payments').innerHTML=Array.isArray(p)&&p.length?`<table><thead><tr><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>${p.map(x=>`<tr><td>${esc(x.created_at||x.date)}</td><td>${money(x.amount)}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table>`:'No payment records to display.'}
function renderInvoices(){const p=state.invoices||state.subscription?.invoices||[];document.getElementById('invoices').innerHTML=Array.isArray(p)&&p.length?`<table><thead><tr><th>Date</th><th>Invoice</th><th></th></tr></thead><tbody>${p.map(x=>`<tr><td>${esc(x.created_at||x.date)}</td><td>${esc(x.number||x.invoice_number||'Invoice')}</td><td>${x.download_url?`<a class="btn" href="${esc(x.download_url)}" target="_blank" rel="noopener">Download</a>`:'—'}</td></tr>`).join('')}</tbody></table>`:'Invoices will appear here when available.'}
document.getElementById('monthly').onclick=()=>{state.cycle='monthly';document.getElementById('monthly').classList.add('active');document.getElementById('yearly').classList.remove('active');renderPlans()};document.getElementById('yearly').onclick=()=>{state.cycle='yearly';document.getElementById('yearly').classList.add('active');document.getElementById('monthly').classList.remove('active');renderPlans()};document.getElementById('refresh').onclick=load;document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.plan)await fn('glime-billing-upgrade-quote',{plan_code:b.dataset.plan,billing_cycle:state.cycle});else if(b.dataset.addon)await fn('glime-billing-upgrade-quote',{addon_code:b.dataset.addon});else if(b.dataset.action==='wallet')await fn('glime-cashfree-create-wallet-topup',{});else if(b.dataset.action==='buy-credits')await fn('glime-billing-buy-ai-credits',{});else if(b.dataset.action==='manage')await fn('glime-cashfree-manage-subscription',{});else if(b.dataset.action==='cancel')await fn('glime-cashfree-manage-subscription',{action:'cancel'});else if(b.dataset.action==='resume')await fn('glime-cashfree-manage-subscription',{action:'resume'});await load()}catch(err){setNotice('This billing action could not be completed. Please try again.');console.error(err)}});load();
</script>
</body></html>
