<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLIME Billing</title>
<link rel="icon" type="image/svg+xml" href="glime_logo_clean.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
<style>
:root{--bg:#05080c;--panel:#111827;--panel2:#0b1420;--line:rgba(255,255,255,.08);--text:#fff;--muted:#9ca3af;--green:#00ff88;--cyan:#00f0ff;--danger:#ff4757}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,rgba(0,240,255,.08),transparent 32%),radial-gradient(circle at top left,rgba(0,255,136,.06),transparent 30%),var(--bg);color:var(--text);font-family:Poppins,Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px 16px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}.brand img{width:48px;height:48px;object-fit:contain}.brand b{font-size:22px}.brand span{display:block;color:var(--muted);font-size:12px}.btn{border:1px solid rgba(0,255,136,.32);background:rgba(0,255,136,.07);color:var(--green);padding:10px 15px;border-radius:10px;cursor:pointer;font-weight:700;transition:.2s}.btn:hover{background:rgba(0,255,136,.14);box-shadow:0 0 18px rgba(0,255,136,.1)}.btn.primary{background:linear-gradient(135deg,rgba(0,255,136,.18),rgba(0,240,255,.14));border-color:rgba(0,240,255,.45);color:#fff}.btn.danger{border-color:rgba(255,71,87,.35);color:#ff8d98;background:rgba(255,71,87,.06)}.card{background:rgba(17,24,39,.88);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 14px 35px rgba(0,0,0,.22)}.section{margin-top:18px}.grid{display:grid;gap:16px}.plans{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr 1fr}.card h2,.card h3{margin:0 0 8px}.muted{color:var(--muted)}.price{font-size:30px;font-weight:800;margin:14px 0;color:#fff}.price small{font-size:13px;color:var(--muted);font-weight:500}.toggle{display:flex;justify-content:center;margin:0 0 18px}.toggle button{padding:9px 18px;border:1px solid rgba(0,255,136,.25);background:rgba(0,255,136,.04);color:var(--muted);cursor:pointer}.toggle button:first-child{border-radius:10px 0 0 10px}.toggle button:last-child{border-radius:0 10px 10px 0}.toggle .active{background:linear-gradient(90deg,rgba(0,255,136,.18),rgba(0,240,255,.12));color:#fff;border-color:rgba(0,240,255,.45)}.features{padding-left:18px;color:#dbe5f2;line-height:1.9}.stat{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.2);color:var(--cyan);font-size:12px}.bar{height:9px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:99px}.notice{padding:12px 14px;border-radius:12px;background:rgba(0,240,255,.06);border:1px solid rgba(0,240,255,.18);margin-bottom:14px}.notice.error{background:rgba(255,71,87,.06);border-color:rgba(255,71,87,.22)}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}.empty{color:var(--muted);padding:8px 0}.loader{color:var(--muted);padding:20px 0}.small{font-size:12px}.success{color:var(--green)}.cyan{color:var(--cyan)}@media(max-width:850px){.plans,.cols{grid-template-columns:1fr}.top{align-items:flex-start}.price{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<a class="brand" href="dashboard.html"><img src="glime_logo_clean.svg" alt="GLIME"><div><b>GLIME</b><span>Billing & Usage</span></div></a>
<button class="btn" id="refresh">Refresh</button>
</header>
<div id="notice" class="notice hidden"></div>
<section class="card" id="subscription"><h2>Current subscription</h2><div id="subBody" class="loader">Loading…</div></section>
<section class="section"><div class="toggle"><button id="monthly" class="active">Monthly</button><button id="yearly">Yearly</button></div><div id="plans" class="grid plans"></div></section>
<section class="section grid cols">
<div class="card"><h3>Business Data</h3><div id="dataAddons" class="loader">Loading…</div></div>
<div class="card"><h3>AI Credits</h3><div id="credits" class="loader">Loading…</div><div class="small muted" style="margin-top:10px">1 GLIME Credit = 1,000 AI tokens. Input + output tokens are counted together.</div></div>
</section>
<section class="section grid cols">
<div class="card"><h3>Wallet</h3><div id="wallet" class="loader">Loading…</div><div class="actions"><input id="walletAmount" type="number" min="100" step="1" value="100" style="flex:1;min-width:130px;background:#0b1420;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px"><button class="btn primary" id="walletBtn">Add Balance</button></div></div>
<div class="card"><h3>Usage</h3><div id="usage" class="loader">Loading…</div></div>
</section>
<section class="section card"><h3>Agents & Access</h3><div id="agents" class="loader">Loading…</div></section>
<section class="section card"><h3>Payment History</h3><div id="payments" class="loader">Loading…</div></section>
<section class="section card"><h3>Invoices</h3><div id="invoices" class="loader">Loading…</div></section>
</div>
<script>
const SUPABASE_URL='https://ufoulgbiqgjriwapuopc.supabase.co';
const SUPABASE_KEY='sb_publishable_BRqfs9ElsX5mPJgrIxdFrQ_884V2SwA';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state={cycle:'monthly',catalog:{growth:null,omni:null,data:[]},billing:null};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>v==null?'—':new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(v));
function fnUrl(name){return `${SUPABASE_URL}/functions/v1/${name}`}
async function authHeaders(){const {data:{session},error}=await sb.auth.getSession();if(error||!session){location.replace('login.html');throw Error('LOGIN_REQUIRED')}return {Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'}}
async function call(name,body=null,method='POST',query=''){const h=await authHeaders();const r=await fetch(fnUrl(name)+query,{method,headers:h,body:method==='GET'?undefined:JSON.stringify(body??{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||'Request failed');return d}
function notice(msg,error=false){const n=$('notice');n.textContent=msg;n.classList.remove('hidden');n.classList.toggle('error',error)}
async function product(code,cycle){return call('glime-billing-catalog',null,'GET',`?product_code=${encodeURIComponent(code)}&interval=${encodeURIComponent(cycle)}`)}
function productPrice(x){return x?.data?.price||x?.price||null}
async function loadCatalog(){const [g,o,gD,oD]=await Promise.all([product('glime_growth',state.cycle),product('glime_omni',state.cycle),product('glime_growth',state.cycle),product('glime_omni',state.cycle)]);state.catalog.growth=g.data;state.catalog.omni=o.data;const codes=['glime_business_data_50mb','glime_business_data_100mb'];state.catalog.data=[];for(const c of codes){try{const r=await product(c,'monthly');if(r?.data?.product)state.catalog.data.push(r.data)}catch(e){}}}
function renderPlans(){const arr=[state.catalog.growth,state.catalog.omni].filter(Boolean);$('plans').innerHTML=arr.map(p=>{const pr=p.price||{};const ents=p.entitlements||[];return `<article class="card"><span class="badge">${esc((p.product?.product_code||'').replace('glime_','').toUpperCase())}</span><h2 style="margin-top:10px">${esc(p.product?.name||'GLIME Plan')}</h2><div class="muted">${esc(p.product?.description||'')}</div><div class="price">${money(pr.amount)} <small>/ ${esc(pr.billing_interval||state.cycle)}</small></div><ul class="features">${ents.slice(0,8).map(e=>`<li>${esc(e.entitlement_code)}${e.quantity!=null?` — ${esc(e.quantity)} ${esc(e.unit||'')}`:''}</li>`).join('')}</ul><button class="btn primary planBtn" data-product="${esc(p.product?.product_code)}" data-interval="${esc(pr.billing_interval||state.cycle)}">Choose plan</button></article>`}).join('')||'<div class="card empty">Plans are unavailable right now.</div>'}
function renderSubscription(){const b=state.billing||{};const s=b.current_subscription;if(!s){$('subBody').innerHTML='<div class="empty">No paid subscription. Your GLIME account can use the available Free access according to its current billing configuration.</div>';return}const p=b.current_product||{};$('subBody').innerHTML=`<div class="stat"><span>Plan</span><b>${esc(p.name||p.product_code||'GLIME')}</b></div><div class="stat"><span>Status</span><span class="badge">${esc(s.status)}</span></div><div class="stat"><span>Amount</span><b>${money(s.amount)}</b></div><div class="stat"><span>Billing cycle</span><span>${esc(b.current_price?.billing_interval||'—')}</span></div><div class="stat"><span>Current period</span><span>${esc((s.current_period_start||'').slice(0,10))} → ${esc((s.current_period_end||'').slice(0,10))}</span></div><div class="actions"><button class="btn primary" id="changePlan">Change Plan</button><button class="btn" id="renewBtn">${s.auto_renew?'Cancel auto-renew':'Resume auto-renew'}</button></div>`;$('renewBtn').onclick=async()=>{try{await call('glime-cashfree-manage-subscription',{action:s.auto_renew?'cancel_auto_renew':'resume_auto_renew'});await loadAll();notice('Billing setting updated.')}catch(e){notice(e.message,true)}};$('changePlan').onclick=()=>document.getElementById('plans').scrollIntoView({behavior:'smooth'})}
function renderAddons(){const arr=state.catalog.data;$('dataAddons').innerHTML=arr.length?arr.map(x=>{const p=x.product,pr=x.price||{};return `<div class="row"><div><b>${esc(p.name)}</b><div class="muted small">${esc(p.description||'')}</div></div><div style="text-align:right"><b>${money(pr.amount)}</b><div class="small muted">/month</div><button class="btn" style="margin-top:7px" data-data-code="${esc(p.product_code)}">Add</button></div></div>`}).join(''):'Business Data options are currently unavailable.'}
function renderCredits(){const tx=state.billing?.ai_credits||state.billing?.credits||null;const ent=(state.billing?.entitlements||[]).find(x=>x.entitlement_code==='ai_credits');if(!tx&&!ent){$('credits').innerHTML='<div class="empty">AI Credit balance will appear here when credits are granted.</div>';return}const credits=Number(tx?.balance_credits??ent?.quantity??0);const tokens=Number(tx?.remaining_tokens??credits*1000);$('credits').innerHTML=`<div class="stat"><span>Credits remaining</span><b class="cyan">${credits.toLocaleString('en-IN')}</b></div><div class="stat"><span>AI tokens remaining</span><b>${tokens.toLocaleString('en-IN')}</b></div>`}
function renderWallet(){const w=state.billing?.wallet;if(!w){$('wallet').innerHTML='<div class="empty">Wallet will be created when you add balance.</div>';return}$('wallet').innerHTML=`<div class="stat"><span>Balance</span><b class="success">${money(w.balance)}</b></div><div class="stat"><span>Status</span><span class="badge">${esc(w.status)}</span></div>`}
function renderUsage(){const rows=state.billing?.usage_summary||[];const labels={voice_minute:'Voice AI',sms_message:'SMS',email_message:'Email',instagram_message:'Instagram',whatsapp_message:'WhatsApp',whatsapp_marketing_24h:'WhatsApp follow-up/marketing',lead_processing:'Lead processing',ai_token:'AI tokens'};$('usage').innerHTML=rows.length?rows.map(r=>`<div class="stat"><span>${esc(labels[r.usage_code]||r.usage_code)}</span><span>${Number(r.quantity||0).toLocaleString('en-IN')} · ${money(r.amount||0)}</span></div>`).join(''):'<div class="empty">No usage recorded yet.</div>'}
function renderAgents(){const rows=state.billing?.entitlements||[];const agents=rows.filter(x=>x.entitlement_code&&(/agent|core_agents|omni_access|voice|connector/i.test(x.entitlement_code)));$('agents').innerHTML=agents.length?agents.map(x=>`<div class="row"><span>${esc(x.entitlement_code)}</span><span class="badge">${esc(x.status||'active')}</span></div>`).join(''):'<div class="empty">Agent access is controlled by your active GLIME entitlements.</div>'}
function renderPayments(){const rows=state.billing?.orders||[];$('payments').innerHTML=rows.length?`<table><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc((x.created_at||'').slice(0,19).replace('T',' '))}</td><td>${esc(x.order_type)}</td><td>${money(x.total_amount)}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No payment records yet.</div>'}
function renderInvoices(){const rows=state.billing?.invoices||[];$('invoices').innerHTML=rows.length?`<table><thead><tr><th>Date</th><th>Invoice</th><th>Total</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc((x.created_at||'').slice(0,10))}</td><td>${esc(x.invoice_number)}</td><td>${money(x.total_amount)}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No invoices yet.</div>'}
async function subscribe(code,interval){const d=await call('glime-cashfree-create-subscription',{product_code:code,billing_interval:interval});const session=d?.subscription_session_id||d?.data?.subscription_session_id;if(!session)throw Error('Subscription checkout is not ready.');const cf=Cashfree({mode:(d.environment||d.data?.environment||'sandbox')==='production'?'production':'sandbox'});await cf.checkout({subscriptionSessionId:session})}
async function upgrade(code,interval){const q=await call('glime-billing-upgrade-quote',{target_product_code:code,billing_interval:interval});const quote=q.data||q;const charge=Number(quote.charge_now||quote.amount_due||0);if(!charge)throw Error('This plan change has no payable upgrade amount right now.');const d=await call('glime-cashfree-create-upgrade-payment',{product_code:code,billing_interval:interval});const session=d?.data?.payment_session_id;if(!session)throw Error('Plan change checkout is not ready.');const cf=Cashfree({mode:(d.environment||'sandbox')==='production'?'production':'sandbox'});await cf.checkout({paymentSessionId:session})}
async function walletTopup(){const amount=Number($('walletAmount').value);if(!Number.isFinite(amount)||amount<100){notice('Minimum wallet balance addition is ₹100.',true);return}const d=await call('glime-cashfree-create-wallet-topup',{amount});const session=d?.data?.payment_session_id;if(!session)throw Error('Balance addition is not ready.');const cf=Cashfree({mode:(d.environment||'sandbox')==='production'?'production':'sandbox'});await cf.checkout({paymentSessionId:session})}
async function loadAll(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html');return}const b=await call('glime-billing-my-subscription',null,'GET');state.billing=b.data||b;await loadCatalog();renderSubscription();renderPlans();renderAddons();renderCredits();renderWallet();renderUsage();renderAgents();renderPayments();renderInvoices()}
$('monthly').onclick=async()=>{state.cycle='monthly';$('monthly').classList.add('active');$('yearly').classList.remove('active');try{await loadCatalog();renderPlans()}catch(e){notice(e.message,true)}};
$('yearly').onclick=async()=>{state.cycle='yearly';$('yearly').classList.add('active');$('monthly').classList.remove('active');try{await loadCatalog();renderPlans()}catch(e){notice(e.message,true)}};
$('refresh').onclick=async()=>{try{await loadAll();notice('Billing refreshed.')}catch(e){notice(e.message,true)}};
$('walletBtn').onclick=async()=>{try{await walletTopup()}catch(e){notice(e.message,true)}};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.classList.contains('planBtn')){const code=b.dataset.product,interval=b.dataset.interval;const current=state.billing?.current_product?.product_code;if(!current)await subscribe(code,interval);else if(current!==code)await upgrade(code,interval);else notice('You are already on this plan.')}else if(b.dataset.dataCode){notice('This Business Data option is cataloged and ready for backend activation; its checkout action is not enabled until the addon payment route is mapped.')} }catch(err){notice(err.message,true)}});
(async()=>{try{await loadAll()}catch(e){notice(e.message||'Billing could not be loaded.',true)}})();
</script>
</body>
</html>
