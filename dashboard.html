<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Dashboard | Glime Web Agency</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --bg-dark: #0a0f16; --card-bg: #111827; --neon-green: #00ff88; --cyan-blue: #00f0ff; --text-main: #ffffff; --text-muted: #9ca3af; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px 15px; }
        
        .dashboard-container { max-width: 500px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; }
        .header h1 { font-size: 1.4rem; background: linear-gradient(90deg, var(--neon-green), var(--cyan-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .logout-btn { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid #ff4757; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }

        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 15px; }
        .card h3 { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .card p { font-size: 0.95rem; font-weight: 600; word-break: break-all; }
        
        .invoice-btn { display: block; width: 100%; text-align: center; background: linear-gradient(90deg, var(--neon-green), var(--cyan-blue)); color: #000; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 0.95rem; }
        
        #loading { text-align: center; color: var(--cyan-blue); margin-top: 50px; }
        #dashboard-content { display: none; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>Client Portal</h1>
            <button class="logout-btn" onclick="logout()">Log Out</button>
        </div>

        <div id="loading">Loading...</div>

        <div id="dashboard-content">
            <div class="card">
                <h3>Welcome</h3>
                <p id="userEmail">...</p>
            </div>

            <div class="card">
                <h3>Project Name</h3>
                <p id="projectName">Loading...</p>
            </div>

            <div class="card">
                <h3>Payment Status</h3>
                <p id="paymentStatus">Loading...</p>
            </div>

            <div class="card" id="invoiceCard">
                <a href="#" id="invoiceLink" class="invoice-btn" target="_blank">View Zoho Invoice</a>
            </div>
        </div>
    </div>

    <script>
        var SUPABASE_URL = 'https://ufoulgbiqgjriwapuopc.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_BRqfs9ElsX5mPJgrIxdFrQ_884V2SwA';
        var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchDashboardData() {
            var { data: authData } = await supabase.auth.getUser();
            if (!authData.user) { window.location.href = 'login.html'; return; }

            var userEmail = authData.user.email;
            document.getElementById('userEmail').textContent = userEmail;

            var { data: clientData } = await supabase
                .from('client_data')
                .select('*')
                .eq('email', userEmail)
                .single();

            if (clientData) {
                document.getElementById('projectName').textContent = clientData.project_name || 'N/A';
                document.getElementById('paymentStatus').textContent = clientData.payment_status || 'N/A';
                if (clientData.invoice_link) {
                    document.getElementById('invoiceLink').href = clientData.invoice_link;
                } else {
                    document.getElementById('invoiceCard').style.display = 'none';
                }
            } else {
                document.getElementById('projectName').textContent = 'Data not found.';
                document.getElementById('invoiceCard').style.display = 'none';
            }
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard-content').style.display = 'block';
        }

        async function logout() { await supabase.auth.signOut(); window.location.href = 'login.html'; }
        fetchDashboardData();
    </script>
</body>
</html>
