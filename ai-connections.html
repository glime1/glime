<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connector | GLIME</title>
<link rel="icon" type="image/svg+xml" href="glime_logo_clean.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="connector-ui.js"></script>
<style>
:root{--bg:#071016;--surf:#101b29;--surf2:#0b1520;--bd:rgba(184,222,234,.13);--tx:#f4fbfd;--mu:#9cabb9;--cy:#52e8ff;--gr:#50f5a8;--rd:#ff8291}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Manrope,Arial,sans-serif;line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{width:min(1180px,calc(100% - 24px));margin:0 auto;padding:18px 0 70px}
.back{display:inline-block;color:var(--cy);font-size:.8rem;font-weight:800;margin-bottom:18px}
.back:focus-visible{outline:2px solid var(--cy);outline-offset:3px;border-radius:4px}
.hero{margin-bottom:22px}
.eyebrow{color:var(--cy);font-size:.68rem;letter-spacing:.14em;font-weight:800}
h1{font-size:2rem;letter-spacing:-.035em;margin:4px 0 5px}
.sub{color:var(--mu);font-size:.84rem}
.message{display:none;margin:0 0 16px;padding:12px 14px;border-radius:12px;font-size:.8rem}
.message.error{display:block;background:rgba(255,130,145,.08);border:1px solid rgba(255,130,145,.3);color:var(--rd)}
.gcx-upgrade{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
@media(max-width:760px){h1{font-size:1.7rem}.wrap{width:min(100% - 18px,620px);padding-top:12px}}
</style>
</head>
<body>
<div class="wrap" id="page">
  <a class="back" href="dashboard.html">← Dashboard</a>

  <div class="hero">
    <div class="eyebrow">CONNECTOR HUB</div>
    <h1>Connector</h1>
    <p class="sub">Connect GLIME with the tools your business already uses.</p>
  </div>

  <div id="message" class="message" role="alert"></div>
  <div id="hub"></div>
  <div id="cargo" style="margin-top:6px"></div>
  <div id="permissions" style="margin-top:24px"></div>
</div>

<script>
const SUPABASE_URL="https://ufoulgbiqgjriwapuopc.supabase.co";
const SUPABASE_KEY="sb_publishable_BRqfs9ElsX5mPJgrIxdFrQ_884V2SwA";
const MCP_ENDPOINT=SUPABASE_URL+"/functions/v1/glime-mcp-gateway";
/* GLIME Omni (the Rs 1499 / month plan) */
const UPGRADE_HREF="billing.html?plan=omni";
const sb=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);

const UI=window.GLIME_CONNECTOR_UI;
const hub=document.getElementById("hub");
const cargoHost=document.getElementById("cargo");
const perms=document.getElementById("permissions");
const base={
  mcpEndpoint:MCP_ENDPOINT,
  note:{text:"WhatsApp and Instagram are managed under Channels.",linkText:"Open Channels",href:"settings.html"}
};

function showError(text){
  const el=document.getElementById("message");
  el.textContent=text;
  el.className="message error";
}

/* ChatGPT and Claude need the AI Connections module. When a client does not have it,
   the card stays visible and the button asks for a plan upgrade instead of connecting.
   Every other connector is shown and works the same for all clients. */
function patchUpgradeButtons(){
  hub.querySelectorAll('.gcx-card[data-provider="chatgpt"][data-state="unavailable"],.gcx-card[data-provider="claude"][data-state="unavailable"]').forEach(function(card){
    const act=card.querySelector(".gcx-actions");
    if(!act||act.querySelector("[data-upgrade]"))return;
    const nameEl=card.querySelector(".gcx-name");
    const name=nameEl?nameEl.textContent:"this connector";
    const a=document.createElement("a");
    a.className="gcx-btn primary gcx-upgrade";
    a.setAttribute("data-upgrade","");
    a.href=UPGRADE_HREF;
    a.textContent="Upgrade plan to connect";
    a.setAttribute("aria-label","Upgrade your plan to connect "+name);
    act.textContent="";
    act.appendChild(a);
    const badge=card.querySelector(".gcx-badge");
    if(badge)badge.textContent="Plan upgrade required";
  });
}
new MutationObserver(patchUpgradeButtons).observe(hub,{childList:true,subtree:true});

/* Shiprocket Cargo lives in its own file, so a problem there never breaks this page. */
function loadCargo(){
  return new Promise(function(resolve){
    if(window.GLIME_CARGO)return resolve(true);
    const s=document.createElement("script");
    s.src="connector-shiprocket-addon.js";
    s.onload=function(){resolve(!!window.GLIME_CARGO);};
    s.onerror=function(){resolve(false);};
    document.head.appendChild(s);
  });
}

(async()=>{
  try{
    if(!UI)throw new Error("Connector UI could not be loaded");

    const {data,error}=await sb.auth.getSession();
    if(error||!data.session){
      location.href="login.html";
      return;
    }

    UI.render(hub,{...base,status:"loading"});

    /* Shiprocket Cargo loads and reports its own status independently. */
    loadCargo().then(function(ok){
      if(!ok||!cargoHost.isConnected)return;
      window.GLIME_CARGO.mount(cargoHost,{sb:sb,supabaseUrl:SUPABASE_URL,apiKey:SUPABASE_KEY});
    });

    const res=await UI.data.loadAll(sb,{supabaseUrl:SUPABASE_URL,apiKey:SUPABASE_KEY});

    UI.render(hub,{
      ...base,
      status:res.failed?"error":"ready",
      errorMessage:res.failed?"Some connector statuses could not be loaded.":undefined,
      states:res.states,
      details:res.details,
      calendarApi:res.calendarApi,
      shopifyApi:res.shopifyApi,
      sheetsApi:res.sheetsApi,
      razorpayApi:res.razorpayApi
    });
    patchUpgradeButtons();
    if(res.entitled)UI.renderPermissions(perms,res.permissions);
  }catch(error){
    console.error("Connector load error:",error);
    if(UI){
      UI.render(hub,{...base,status:"error",states:{chatgpt:"error",claude:"error","google-calendar":"error",shopify:"error","google-sheets":"error",razorpay:"error"}});
    }else{
      showError("Connector status could not be loaded.");
    }
  }
})();
</script>
</body>
</html>
