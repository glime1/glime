<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connector | GLIME</title>
<link rel="icon" type="image/svg+xml" href="glime_logo_clean.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="connector-ui.js"></script>
<style>
:root{--bg:#071016;--surf:#101b29;--surf2:#0b1520;--bd:rgba(184,222,234,.13);--tx:#f4fbfd;--mu:#9cabb9;--cy:#52e8ff;--gr:#50f5a8;--rd:#ff8291}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Manrope,Arial,sans-serif;line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{width:min(1180px,calc(100% - 24px));margin:0 auto;padding:18px 0 70px}
.back{display:inline-block;color:var(--cy);font-size:.8rem;font-weight:800;margin-bottom:18px}
.back:focus-visible{outline:2px solid var(--cy);outline-offset:3px;border-radius:4px}
.hero{margin-bottom:22px}
.eyebrow{color:var(--cy);font-size:.68rem;letter-spacing:.14em;font-weight:800}
h1{font-size:2rem;letter-spacing:-.035em;margin:4px 0 5px}
.sub{color:var(--mu);font-size:.84rem}
.message{display:none;margin:0 0 16px;padding:12px 14px;border-radius:12px;font-size:.8rem}
.message.error{display:block;background:rgba(255,130,145,.08);border:1px solid rgba(255,130,145,.3);color:var(--rd)}
.unavail{background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:20px}
.unavail p{color:var(--mu);font-size:.84rem;margin-top:6px}
@media(max-width:760px){h1{font-size:1.7rem}.wrap{width:min(100% - 18px,620px);padding-top:12px}}
</style>
</head>
<body>
<div class="wrap" id="page">
  <a class="back" href="dashboard.html">← Dashboard</a>

  <div class="hero">
    <div class="eyebrow">CONNECTOR HUB</div>
    <h1>Connector</h1>
    <p class="sub">Connect GLIME with the tools your business already uses.</p>
  </div>

  <div id="message" class="message" role="alert"></div>
  <div id="hub"></div>
  <div id="permissions" style="margin-top:24px"></div>
</div>

<script>
const SUPABASE_URL="https://ufoulgbiqgjriwapuopc.supabase.co";
const SUPABASE_KEY="sb_publishable_BRqfs9ElsX5mPJgrIxdFrQ_884V2SwA";
const MCP_ENDPOINT=SUPABASE_URL+"/functions/v1/glime-mcp-gateway";
const sb=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);

const UI=window.GLIME_CONNECTOR_UI;
const hub=document.getElementById("hub");
const perms=document.getElementById("permissions");
const base={
  mcpEndpoint:MCP_ENDPOINT,
  note:{text:"WhatsApp and Instagram are managed under Channels.",linkText:"Open Channels",href:"settings.html"}
};

function showError(text){
  const el=document.getElementById("message");
  el.textContent=text;
  el.className="message error";
}

(async()=>{
  try{
    if(!UI)throw new Error("Connector UI could not be loaded");

    const {data,error}=await sb.auth.getSession();
    if(error||!data.session){
      location.href="login.html";
      return;
    }

    UI.render(hub,{...base,status:"loading"});

    const res=await UI.data.loadAll(sb,{supabaseUrl:SUPABASE_URL,apiKey:SUPABASE_KEY});

    /* Existing ai-connections module entitlement still gates this page. */
    if(!res.aiFailed&&!res.entitled){
      document.getElementById("page").innerHTML=`
        <a class="back" href="dashboard.html">← Dashboard</a>
        <div class="unavail">
          <h1>Connector</h1>
          <p>Connector is currently unavailable for this client.</p>
        </div>`;
      return;
    }

    UI.render(hub,{
      ...base,
      status:res.failed?"error":"ready",
      errorMessage:res.failed?"Some connector statuses could not be loaded.":undefined,
      states:res.states,
      details:res.details,
      calendarApi:res.calendarApi
    });
    if(res.entitled)UI.renderPermissions(perms,res.permissions);
  }catch(error){
    console.error("Connector load error:",error);
    if(UI){
      UI.render(hub,{...base,status:"error",states:{chatgpt:"error",claude:"error","google-calendar":"error"}});
    }else{
      showError("Connector status could not be loaded.");
    }
  }
})();
</script>
</body>
</html>
