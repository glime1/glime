  const op=(a,v,f)=>a.map(o=>`<option value="${esc(o.id)}"${o.id===v?' selected':''}>${f(o)}</option>`).join('');
  if(k==='bk'){
    const chips=st.slots.length?st.slots.slice(0,14).map(t=>`<button type="button" class="chip${t===d.time?' on':''}" data-act="slot" data-t="${t}">${t}</button>`).join(' '):'<span class="mu">No free slot for this choice. You can still type a time.</span>';
    b=`<h3>${d.id?(d.mode==='resched'?'Reschedule':'Booking details'):'New '+esc(l.b.toLowerCase())}</h3>
    <div class="g2"><label>${esc(l.c)} name<input data-f="customer" maxlength="100" value="${esc(d.customer)}"></label><label>Mobile<input data-f="phone" inputmode="tel" maxlength="20" value="${esc(d.phone)}"></label></div>
    <div class="g2"><label>Service<select data-f="service_id" data-re>${op(st.svc,d.service_id,s=>esc(s.name)+' · '+s.duration+' min')}</select></label><label>${esc(l.r)}<select data-f="resource_id" data-re>${op(st.res,d.resource_id,r=>esc(r.name))}</select></label></div>
    <div class="g2"><label>Date<input type="date" data-f="date" data-re value="${esc(d.date)}"></label><label>Time<input type="time" data-f="time" value="${esc(d.time)}"></label></div>
    <p class="mu" style="margin:0 0 6px">Free times</p><div class="bar" style="margin-bottom:12px">${chips}</div>
    <label>Status<select data-f="status">${Object.keys(ST).map(s=>`<option value="${s}"${s===d.status?' selected':''}>${ST[s][0]}</option>`).join('')}</select></label>
    <label>Notes<textarea data-f="notes" maxlength="500">${esc(d.notes)}</textarea></label>${d.src?`<p class="mu">Booking source: ${esc(SRC[d.src]||'Staff')}</p>`:''}${d.id&&d.phone?'<button type="button" data-act="sheet-remind" style="margin-bottom:10px">Send WhatsApp reminder now</button>':''}`;
  }else if(k==='res'){
    b=`<h3>${d.id?'Edit':'Add'} ${esc(l.r.toLowerCase())}</h3><label>Name<input data-f="name" maxlength="80" value="${esc(d.name)}"></label><p class="mu">Colour</p><div class="bar" style="margin-bottom:12px">${COLORS.map(c=>`<button type="button" class="sw2${c===d.color?' on':''}" data-act="color" data-c="${c}" style="background:${c}" aria-label="Colour ${c}"></button>`).join('')}</div>`;
  }else{
    b=`<h3>${d.id?'Edit':'Add'} service</h3><label>Name<input data-f="name" maxlength="80" value="${esc(d.name)}"></label>
    <div class="g2"><label>Duration (min)<input type="number" min="5" max="480" data-f="duration" value="${esc(d.duration)}"></label><label>Buffer after (min)<input type="number" min="0" max="120" data-f="buffer" value="${esc(d.buffer)}"></label></div>
    <label>Price (Rs)<input type="number" min="0" data-f="price" value="${esc(d.price)}"></label>
    <label>What the agent tells customers<textarea data-f="info" maxlength="300">${esc(d.info)}</textarea></label>
    <div class="row"><div><b>Agent can book this</b><span class="mu">Off keeps it for staff only.</span></div><input class="sw" type="checkbox" data-f="agent"${d.agent?' checked':''} aria-label="Agent can book this"></div>`;
  }
  return `<div class="ov" data-act="close"><div class="sh" role="dialog" aria-modal="true">${b}<div class="bar" style="margin-top:8px"><button class="p" data-act="save">Save</button><button data-act="close">Close</button>${d.id?'<button class="d" data-act="del-sheet" style="margin-left:auto">Delete</button>':''}</div></div></div>`;
}
function render(){
  if(st.loading){$app.innerHTML='<div class="msg">Loading calendar…</div>';return;}
  if(st.off){$app.innerHTML='<div class="card empty" style="margin-top:24px"><h1>Calendar is off</h1><p class="mu" style="margin:8px 0 0">Turn on the GLIME Calendar connector to use your appointment calendar and AI booking agent.</p><a class="p lnk" href="ai-connections.html">Open Connector</a></div>';return;}
  if(st.fail){$app.innerHTML=`<div class="card empty" style="margin-top:24px"><h1>Calendar could not load</h1><p class="mu" style="margin:8px 0 14px">${esc(st.fail)}</p><div class="bar" style="justify-content:center"><button class="p" data-act="retry">Try again</button><button data-act="demo">Preview with sample data</button></div></div>`;return;}
  const demo=DEMO?'<div class="msg demo">Preview mode: sample data only. Nothing is saved.</div>':'';
  const m=st.msg?`<div class="msg ${st.msg.t}" role="${st.msg.t==='err'?'alert':'status'}">${esc(st.msg.x)}</div>`:'';
  const nb=(k,l,i)=>`<button class="${st.tab===k?'on':''}" data-act="tab" data-t="${k}">${ic(i,20)} ${l}</button>`;
  const y=window.scrollY;
  $app.innerHTML=demo+m+(st.tab==='cal'?calView():st.tab==='agent'?agentView():setupView())+(st.sheet?sheet():'')+`<nav class="nav" aria-label="Sections">${nb('cal','Calendar','cal')}${nb('agent','Agent','bot')}${nb('set','Setup','cog')}</nav>`;
  window.scrollTo(0,y);
}

/* ---------- Events ---------- */
const readF=()=>{const o={};$app.querySelectorAll('.sh [data-f]').forEach(n=>{o[n.dataset.f]=n.type==='checkbox'?n.checked:n.value;});return o;};
const open=(k,d)=>{st.sheet={k,d};st.msg=null;st.menu=null;return k==='bk'?run(loadSlots):render();};
const emptyBk=(r,t)=>({id:null,customer:'',phone:'',service_id:(st.svc[0]||{}).id,resource_id:r||(st.res[0]||{}).id,date:st.date,time:t||'',status:'confirmed',notes:''});
const editBk=(x,mode)=>({id:x.id,customer:x.customer,phone:x.phone||'',service_id:x.service_id,resource_id:x.resource_id,date:dayOf(x),time:hm(x.start),status:x.status,notes:x.notes||'',src:x.source,mode});
$app.addEventListener('click',e=>{
  if(st.menu&&!e.target.closest('.menu')&&!e.target.closest('[data-act=menu]')){st.menu=null;if(!e.target.closest('[data-act]'))return render();}
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.classList.contains('ov')&&e.target!==b)return;
  const a=b.dataset.act,sh=st.sheet;
  if(a==='tab'){st.tab=b.dataset.t;st.msg=null;st.sheet=null;st.menu=null;return run(async()=>{if(st.tab==='agent')await loadAct();});}
  if(a==='sub'){st.sub=b.dataset.t;return render();}
  if(a==='retry'){st.fail=null;st.loading=true;render();return init();}
  if(a==='demo'){DEMO=true;st.fail=null;st.loading=true;render();return init();}
  if(a==='day'){st.date=b.dataset.d;return render();}
  if(a==='flt'){st.flt=b.dataset.v;return render();}
  if(a==='rf'){st.rf=b.dataset.v;return render();}
  if(a==='view'){st.view=b.dataset.v;return render();}
  if(a==='menu'){st.menu=st.menu===b.dataset.id?null:b.dataset.id;return render();}
  if(a==='today'||a==='wk'){st.date=a==='today'?today:addD(st.date,+b.dataset.n);return run(loadWeek);}
  if(a==='new'){if(!st.svc.length||!st.res.length)return fail('Add a '+L().r.toLowerCase()+' and a service in Setup first.');return open('bk',emptyBk());}
  if(a==='gapbook'){if(!st.svc.length)return fail('Add a service in Setup first.');return open('bk',emptyBk(b.dataset.r,b.dataset.t));}
  if(a==='slotclick'){if(!st.svc.length)return fail('Add a service in Setup first.');const y=e.clientY-b.getBoundingClientRect().top,m=st.s0*60+Math.floor(y/PPH*4)*15;return open('bk',emptyBk(b.dataset.r,pad(Math.floor(m/60))+':'+pad(m%60)));}
  if(a==='open'){const x=st.bk.find(v=>v.id===b.dataset.id);return x?open('bk',editBk(x)):0;}
  if(a==='mact'){
    const x=st.bk.find(v=>v.id===b.dataset.id),v=b.dataset.v;st.menu=null;if(!x)return render();
    if(v==='edit')return open('bk',editBk(x));if(v==='resched')return open('bk',editBk(x,'resched'));
    if(v==='remind')return run(async()=>{await api('booking.remind',{id:x.id});await loadAct();},'WhatsApp reminder sent to '+x.customer+'.');
    if(v==='delete'){if(!confirm('Delete this booking? This cannot be undone.'))return render();return run(async()=>{await api('booking.delete',{id:x.id});await loadWeek();},'Booking deleted.');}
    if(v==='cancelled'&&!confirm('Cancel this booking for '+x.customer+'?'))return render();
    return run(async()=>{await api('booking.status',{id:x.id,status:v});await loadWeek();},'Status updated.');
  }
  if(a==='close'){st.sheet=null;return render();}
  if(a==='sheet-remind'){return run(async()=>{await api('booking.remind',{id:sh.d.id});},'WhatsApp reminder sent.');}
  if(a==='slot'){sh.d={...sh.d,...readF(),time:b.dataset.t};return render();}
  if(a==='color'){sh.d={...sh.d,...readF(),color:b.dataset.c};return render();}
  if(a==='approve'||a==='decline')return run(async()=>{await api('booking.status',{id:b.dataset.id,status:a==='approve'?'confirmed':'cancelled'});await loadWeek();},a==='approve'?'Booking approved. The customer is notified.':'Booking declined.');
  if(a==='add-res')return open('res',{id:null,name:'',color:COLORS[st.res.length%COLORS.length]});
  if(a==='edit-res')return open('res',{...st.res.find(r=>r.id===b.dataset.id)});
  if(a==='add-svc')return open('svc',{id:null,name:'',duration:15,buffer:0,price:0,info:'',agent:true});
  if(a==='edit-svc')return open('svc',{info:'',agent:true,...st.svc.find(s=>s.id===b.dataset.id)});
  if(a==='del-res'||a==='del-svc'||a==='del-sheet'){
    const k=a==='del-sheet'?sh.k:a==='del-res'?'res':'svc',id=a==='del-sheet'?sh.d.id:b.dataset.id;
    if(!confirm(k==='bk'?'Delete this booking? This cannot be undone.':k==='res'?'Delete this '+L().r.toLowerCase()+'?':'Delete this service? Existing bookings stay in your calendar.'))return;
    return run(async()=>{
      if(k==='bk'){await api('booking.delete',{id});await loadWeek();}
      else if(k==='res'){await api('resource.delete',{id});st.res=(await api('resources.list')).items||[];}
      else{await api('service.delete',{id});st.svc=(await api('services.list')).items||[];}
      st.sheet=null;},'Deleted.');
  }
  if(a==='save'){
    const d={...sh.d,...readF()};sh.d=d;
    if(sh.k==='bk'){
      if(!d.customer.trim())return fail('Enter the '+L().c.toLowerCase()+' name.');if(!d.time)return fail('Choose a time.');
      const sv=st.svc.find(s=>s.id===d.service_id),s0=new Date(d.date+'T'+d.time+':00'),e0=new Date(+s0+((sv&&sv.duration)||15)*6e4);
      const hit=d.status==='cancelled'?null:st.bk.find(x=>x.id!==d.id&&x.resource_id===d.resource_id&&x.status!=='cancelled'&&new Date(x.start)<e0&&new Date(x.end)>s0);
      if(hit)return fail('Double booking: '+hit.customer+' already has '+tm(hit.start)+' with '+resOf(hit.resource_id).name+'. Pick a free time.');
      return run(async()=>{await api('booking.save',{id:d.id||undefined,resource_id:d.resource_id,service_id:d.service_id,customer:d.customer.trim(),phone:d.phone.trim(),date:d.date,time:d.time,status:d.status,notes:d.notes.trim()});st.sheet=null;st.date=d.date;await loadWeek();},d.id?'Changes saved.':'Booking created.');
    }
    if(!d.name.trim())return fail('Enter a name.');
    if(sh.k==='res')return run(async()=>{await api('resource.save',{id:d.id||undefined,name:d.name.trim(),color:d.color});st.res=(await api('resources.list')).items||[];st.sheet=null;},'Saved.');
    const du=+d.duration;if(!(du>=5&&du<=480))return fail('Duration must be between 5 and 480 minutes.');
    return run(async()=>{await api('service.save',{id:d.id||undefined,name:d.name.trim(),duration:du,buffer:+d.buffer||0,price:+d.price||0,info:(d.info||'').trim(),agent:!!d.agent});st.svc=(await api('services.list')).items||[];st.sheet=null;},'Saved.');
  }
  if(a==='hrs-save'){
    const items=[...$app.querySelectorAll('[data-hd]')].map(r=>({day:+r.dataset.hd,on:r.querySelector('[data-h=on]').checked,start:r.querySelector('[data-h=start]').value,end:r.querySelector('[data-h=end]').value}));
    const bad=items.find(h=>h.on&&(!h.start||!h.end||h.end<=h.start));if(bad)return fail(DAYS[bad.day]+': end time must be after start time.');
    return run(async()=>{await api('hours.save',{items});st.hours=items;},'Working hours saved.');
  }
  if(a==='rules-save'){
    const v={};$app.querySelectorAll('[data-k]').forEach(n=>{v[n.dataset.k]=n.type==='checkbox'?n.checked:+n.value;});
    if(!(v.min_notice>=0)||!(v.max_days>=1)||!(v.cancel_notice>=0))return fail('Enter valid hours and days.');
    return run(async()=>{await api('settings.save',v);Object.assign(st.set,v);},'Saved.');
  }
  if(a==='test')return agentTest();
});
$app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='ind')return run(async()=>{await api('settings.save',{industry:t.value});st.set.industry=t.value;},'Business type updated.');
  if(t.matches('.sh [data-re]')&&st.sheet){st.sheet.d={...st.sheet.d,...readF()};return run(loadSlots);}
});
$app.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;const l=$app.querySelector('#lst');if(l&&st.view==='list')l.innerHTML=listHtml();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(st.sheet||st.menu)){st.sheet=null;st.menu=null;render();}});
async function agentTest(){
  const sv=$app.querySelector('#t-s').value,rs=$app.querySelector('#t-r').value,date=$app.querySelector('#t-d').value;
  if(!sv||!rs||!date)return fail('Add a service and a '+L().r.toLowerCase()+' first.');
  const lines=[];const out=()=>{st.log=lines.join('\n');const el=$app.querySelector('#log');if(el)el.innerHTML=st.log;};
  try{
    lines.push('<b>customer</b> I want to book on '+esc(date));out();
    lines.push('<b>tool</b> check_availability');out();
    const sl=(await api('availability.check',{resource_id:rs,service_id:sv,date,as:'agent'})).slots||[];
    lines.push('<em>result</em> '+(sl.length?sl.length+' free times, first '+sl[0]:'no free times'));out();
    if(!sl.length){lines.push('<b>agent</b> Sorry, nothing is free that day. Shall I check another day?');out();return;}
    lines.push('<b>tool</b> create_booking '+sl[0]);out();
    await api('booking.save',{resource_id:rs,service_id:sv,customer:'Agent test',phone:'',date,time:sl[0],status:st.set.auto_confirm?'confirmed':'pending',notes:'Created by test run',source:'ai_whatsapp'});
    lines.push('<em>result</em> '+(st.set.auto_confirm?'booking confirmed':'booking held for approval'));out();
    lines.push('<b>agent</b> You are booked for '+esc(date)+' at '+sl[0]+'.');out();
    await Promise.all([loadWeek(),loadAct()]);st.log=lines.join('\n');setMsg('ok','Test booking created. Delete it from the Calendar when done.');render();
  }catch(e){console.error(e);setMsg('err',e.message||'Test failed.');render();}
}

/* ---------- Init ---------- */
async function init(){
  try{
    if(!DEMO){
      /* Sign-in and the Calendar connector switch (Connector > GLIME Calendar) are checked first. */
      const ses=await sb.auth.getSession(),user=ses&&ses.data&&ses.data.session&&ses.data.session.user;
      if(!user){location.replace('login.html');return;}
      let on=false;
      try{on=localStorage.getItem('glime_cal_on_'+user.id)==='1';}catch(e){}
      if(!on){st.off=true;st.loading=false;render();return;}
    }
    const [r,s,h,c]=await Promise.all([api('resources.list'),api('services.list'),api('hours.get'),api('settings.get')]);
    st.res=r.items||[];st.svc=s.items||[];st.hours=h.items||[];st.set={industry:'general',...c};
    await loadWeek();try{await loadAct();}catch(e){}
  }catch(e){console.error(e);st.fail=e.message||'Calendar could not be loaded.';}
  st.loading=false;render();
}
init();
})();
</script>
</body>
</html>
