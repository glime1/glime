<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Others | GLIME</title>
<link rel="icon" type="image/svg+xml" href="glime_logo_clean.svg">
<link rel="stylesheet" href="glime-app-shell.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="glime-dialog.js"></script>
<script src="glime-app-shell.js" defer></script>
<style>
:root{
  --bg:#071016;--surf:#101b29;--surf2:#0b1520;--bd:rgba(184,222,234,.13);
  --tx:#f4fbfd;--mu:#9cabb9;--cy:#52e8ff;--gr:#50f5a8;--rd:#ff8291;
}
.oth *{box-sizing:border-box}
.oth{color:var(--tx);font-family:Manrope,Arial,sans-serif;line-height:1.6;padding:6px 0 70px}
.oth button{font:inherit;cursor:pointer}
.oth .hero{margin-bottom:22px}
.oth .eyebrow{color:var(--cy);font-size:.68rem;letter-spacing:.14em;font-weight:800}
.oth h1{font-size:2rem;letter-spacing:-.035em;margin:4px 0 5px}
.oth .sub{color:var(--mu);font-size:.86rem;max-width:760px}
.oth .layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.oth .nav{position:sticky;top:14px;background:var(--surf);border:1px solid var(--bd);border-radius:17px;padding:8px}
.oth .nav-title{padding:10px 10px 8px;color:var(--mu);font-size:.67rem;font-weight:800;letter-spacing:.12em}
.oth .nav button{
  width:100%;text-align:left;border:0;background:transparent;color:var(--mu);
  padding:12px 13px;border-radius:10px;font-size:.86rem;font-weight:800;margin-bottom:3px
}
.oth .nav button:hover{background:rgba(82,232,255,.06);color:var(--tx)}
.oth .nav button.active{background:rgba(82,232,255,.10);color:var(--cy)}
.oth .content{min-width:0}
.oth .section-head{margin-bottom:13px}
.oth .section-head h2{font-size:1.18rem}
.oth .section-head p{color:var(--mu);font-size:.76rem;margin-top:2px}
.oth .card{background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:15px}
.oth .empty,.oth .error{
  background:var(--surf);border:1px solid var(--bd);border-radius:16px;
  padding:18px;color:var(--mu);font-size:.78rem
}
.oth .error{color:var(--rd)}
.oth .loading{color:var(--mu);font-size:.78rem;padding:10px 0}
.oth .btn{
  border:1px solid var(--bd);background:transparent;color:var(--tx);
  border-radius:10px;padding:10px 14px;font-size:.78rem;font-weight:800
}
.oth .btn.primary{background:linear-gradient(105deg,var(--gr),var(--cy));color:#031014;border:0}
.oth .btn.danger{color:var(--rd);border-color:rgba(255,130,145,.38)}
.oth .btn:disabled{opacity:.5;cursor:default}
.oth .mobile-nav{display:none}
#othToast{
  position:fixed;right:14px;bottom:14px;background:#101b28;color:#fff;border:1px solid var(--bd);
  padding:11px 14px;border-radius:10px;font-size:.77rem;display:none;z-index:2147481000
}
/* Light mode: the pale cyan tab text was hard to read, so use a deeper teal */
html[data-theme="light"] .oth .nav button.active,
html[data-theme="light"] .oth .mobile-nav button.active{
  color:#0e7490;
  border-color:rgba(14,116,144,.45);
  background:rgba(14,116,144,.09)
}
@media(max-width:760px){
  .oth h1{font-size:1.7rem}
  .oth .layout{grid-template-columns:1fr}
  .oth .nav{display:none}
  .oth .mobile-nav{
    display:flex;overflow:auto;gap:9px;padding:9px;background:var(--surf);
    border:1px solid var(--bd);border-radius:16px;margin-bottom:18px
  }
  .oth .mobile-nav:empty{display:none}
  .oth .mobile-nav button{
    flex:none;border:1px solid var(--bd);background:transparent;color:var(--mu);
    padding:13px 18px;border-radius:12px;font-size:.9rem;font-weight:800
  }
  .oth .mobile-nav button.active{color:var(--cy);border-color:rgba(82,232,255,.35);background:rgba(82,232,255,.07)}
}
</style>
</head>

<body data-gas-title="Others" data-gas-support>
<main class="oth" data-gas-content>
  <div id="othMobileNav" class="mobile-nav" aria-label="Others navigation"></div>

  <div class="hero">
    <div class="eyebrow">MORE FROM GLIME</div>
    <h1>Others</h1>
    <p class="sub">Extra tools and features live here, each in its own section.</p>
  </div>

  <div class="layout">
    <aside id="othNav" class="nav" aria-label="Others navigation">
      <div class="nav-title">OTHERS</div>
    </aside>

    <section id="othContent" class="content">
      <div class="loading">Loading…</div>
    </section>
  </div>

  <div id="othToast"></div>
</main>

<script>
/*
  GLIME OTHERS SHELL
  ------------------
  This file intentionally contains the stable shell only:
  - authentication
  - client context
  - navigation (tabs shown at the top on mobile)
  - module registration
  - shared UI helpers

  Do not edit this file to add a new feature, and do not create another
  "others" page. Add a module instead:
    1. create an addon file, for example others-invoices-addon.js
    2. add its name to OTHERS_ADDONS below

  An addon registers itself like this:
      window.GLIME_OTHERS.register({
        id: 'invoices',
        label: 'Invoices',
        order: 10,
        render: async ({container, state, api, ui}) => { ... }
      });

  Dialogs: glime-dialog.js (loaded in <head>) provides GLIME_DIALOG.confirm /
  alert / prompt in GLIME colours.

  Deep links:  others.html#<module-id>   opens that registered module
               (for example others.html#invoices)
*/

/* Addons load in this order; one failing addon never blocks the others. */
const OTHERS_ADDONS = [
  'others-partner-addon.js',
  'others-invoices-addon.js',
  'others-website-addon.js',
  'others-upi-addon.js',
  'others-export-addon.js'
];

const sb = supabase.createClient(
  'https://ufoulgbiqgjriwapuopc.supabase.co',
  'sb_publishable_BRqfs9ElsX5mPJgrIxdFrQ_884V2SwA'
);
window.supabaseClient = window.supabaseClient || sb;

const $ = id => document.getElementById(id);

const state = {
  session: null,
  client: null,
  activeModule: null
};

const modules = new Map();

function toast(message, bad=false){
  const el = $('othToast');
  el.textContent = message;
  el.style.color = bad ? '#ff8291' : '#fff';
  el.style.display = 'block';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.style.display='none', 3200);
}

function gdConfirm(message, options){
  return window.GLIME_DIALOG
    ? window.GLIME_DIALOG.confirm(message, options)
    : Promise.resolve(window.confirm(message));
}

function escapeHtml(value){
  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function registerModule(module){
  if(!module || !module.id || !module.label || typeof module.render !== 'function'){
    console.warn('Invalid GLIME others module', module);
    return;
  }
  modules.set(module.id, {
    order: 100,
    ...module
  });
}

window.GLIME_OTHERS = {
  register: registerModule,
  state,
  api: {
    supabase: sb,
    getClient: () => state.client
  },
  ui: {
    toast,
    escapeHtml,
    confirm: gdConfirm
  }
};

function sortedModules(){
  return [...modules.values()].sort((a,b) => (a.order||0)-(b.order||0));
}

function renderNavigation(){
  const list = sortedModules();
  const desktop = $('othNav');
  const mobile = $('othMobileNav');

  desktop.querySelectorAll('[data-module]').forEach(x=>x.remove());
  mobile.innerHTML = '';

  list.forEach((m, index) => {
    const d = document.createElement('button');
    d.type = 'button';
    d.dataset.module = m.id;
    d.textContent = m.label;
    d.onclick = () => openModule(m.id);
    desktop.appendChild(d);

    const mb = d.cloneNode(true);
    mb.onclick = () => openModule(m.id);
    mobile.appendChild(mb);

    if(index === 0 && !state.activeModule) state.activeModule = m.id;
  });

  markActiveNavigation();
}

function markActiveNavigation(){
  document.querySelectorAll('.oth [data-module]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.module === state.activeModule);
  });
}

async function openModule(id){
  const module = modules.get(id);
  if(!module) return;

  state.activeModule = id;
  markActiveNavigation();

  const content = $('othContent');
  content.innerHTML = `<div class="loading">Loading ${escapeHtml(module.label)}…</div>`;

  try{
    await module.render({
      container: content,
      state,
      api: window.GLIME_OTHERS.api,
      ui: window.GLIME_OTHERS.ui
    });
  }catch(error){
    console.error(error);
    content.innerHTML = `<div class="error">Could not load this section. ${escapeHtml(error.message || 'Unknown error')}</div>`;
  }
}

function showEmpty(){
  $('othContent').innerHTML = `
    <div class="section-head">
      <h2>Nothing here yet</h2>
      <p>New tools will appear in this page as they are added.</p>
    </div>
    <div class="empty">No extra sections are installed yet.</div>`;
}

async function init(){
  const {data:{session}, error:sessionError} = await sb.auth.getSession();

  if(sessionError || !session){
    if(sessionError) console.error(sessionError);
    location.href='login.html';
    return;
  }

  state.session = session;

  const {data:client, error:clientError} = await sb
    .from('client_data')
    .select('client_id,business_name,name')
    .eq('auth_user_id',session.user.id)
    .maybeSingle();

  if(clientError || !client){
    console.error(clientError);
    $('othContent').innerHTML =
      '<div class="error">Your GLIME client profile could not be loaded.</div>';
    return;
  }

  state.client = client;

  if(window.GlimeAppShell){
    window.GlimeAppShell.setIdentity({
      name: client.business_name || client.name || '',
      clientId: client.client_id || ''
    });
  }

  renderNavigation();

  if(!modules.size){
    showEmpty();
    return;
  }
  await openModule(state.activeModule);
}

function loadOthersAddon(src){
  return new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src=src;
    script.async=false;
    script.onload=resolve;
    script.onerror=()=>reject(new Error(`Could not load ${src}`));
    document.head.appendChild(script);
  });
}

(async()=>{
  for(const src of OTHERS_ADDONS){
    try{
      await loadOthersAddon(src);
    }catch(error){
      console.error('Others addon load error:',error);
    }
  }

  /* Deep link, e.g. others.html#invoices */
  const hash = (location.hash || '').replace('#','').toLowerCase();
  if(modules.has(hash)) state.activeModule = hash;

  await init();

  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').replace('#','').toLowerCase();
    if(modules.has(h)) openModule(h);
  });
})();
</script>
</body>
</html>
