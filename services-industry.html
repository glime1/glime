<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GLIME — Choose Your Industry</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="services-industry.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <main class="page-shell">

    <header class="topbar">
      <a
        class="brand"
        href="services.html"
        aria-label="Back to GLIME setup"
      >
        <img src="glime_logo_clean.svg" alt="GLIME">
      </a>

      <div class="step-label">
        STEP <strong>01</strong> / 04
      </div>
    </header>


    <section class="hero">
      <div class="eyebrow">BUSINESS SETUP · INDUSTRY</div>

      <h1>What does your business do?</h1>

      <p>
        Choose the industry that best describes your business.
        You can search the list or select one of the available options.
      </p>

      <div class="progress" aria-label="Setup progress">
        <span class="progress-step active">1</span>
        <span class="progress-line"></span>
        <span class="progress-step">2</span>
        <span class="progress-line"></span>
        <span class="progress-step">3</span>
        <span class="progress-line"></span>
        <span class="progress-step">4</span>
      </div>
    </section>


    <section class="setup-card">

      <div class="search-row">
        <label class="search-box">
          <span class="search-icon">⌕</span>
          <input
            id="industrySearch"
            type="search"
            autocomplete="off"
            placeholder="Search your industry..."
            aria-label="Search industry"
          >
          <button
            id="clearSearchBtn"
            class="clear-search"
            type="button"
            aria-label="Clear search"
            hidden
          >×</button>
        </label>
      </div>


      <div
        id="industryStatus"
        class="status-line"
      >
        Loading industries…
      </div>


      <div
        id="industryList"
        class="industry-list"
        aria-live="polite"
      ></div>


      <div
        id="emptyState"
        class="empty-state"
        hidden
      >
        <h3>No matching industry</h3>
        <p>
          Try another search term.
        </p>
      </div>


      <div
        id="message"
        class="message"
        hidden
      ></div>


      <div class="navigation">

        <a
          class="back-button"
          href="services.html"
        >
          ← Back
        </a>

        <button
          id="nextBtn"
          class="next-button"
          type="button"
          disabled
        >
          Next <span aria-hidden="true">→</span>
        </button>

      </div>

    </section>


    <footer class="footer">
      <span>GLIME</span>
      <span>Industry selection</span>
    </footer>

  </main>

  <script src="services-industry.js"></script>
</body>
</html>
