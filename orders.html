<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080c">
<title>Orders | GLIME</title>
<link rel="icon" type="image/svg+xml" href="glime_logo_clean.svg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="orders.css">
</head>
<body>

<div id="boot" class="boot" role="status"><img src="glime_logo_clean.svg" alt="GLIME"><span>Securing your GLIME workspace…</span></div>

<div class="app-shell">
  <div id="navScrim" class="nav-scrim" data-act="menu"></div>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand"><img src="glime_logo_clean.svg" alt="GLIME"><small>AI BUSINESS WORKSPACE</small></div>
    <nav>
      <a href="dashboard.html">⌂ <span>Dashboard</span></a>
      <a href="services.html">▦ <span>Services</span></a>
      <a href="instagram-sales-specialist.html">◎ <span>Instagram Sales</span></a>
      <a href="whatsapp-sales-specialist.html">◉ <span>WhatsApp Sales</span></a>
      <a href="follow-up.html">↗ <span>Follow-up</span></a>
      <a href="leads.html">◈ <span>Leads AI</span></a>
      <a href="customer.html">☺ <span>Customers</span></a>
      <a class="active" href="orders.html" aria-current="page">🛒 <span>Orders</span></a>
      <a href="billing.html">▣ <span>Billing</span></a>
      <a href="settings.html">⚙ <span>Settings</span></a>
    </nav>
    <div class="side-bottom">
      <div class="workspace-mini"><i></i><div><b id="businessName">Business</b><small id="clientId">Loading…</small></div></div>
      <button id="logout" type="button">Secure Logout</button>
    </div>
  </aside>

  <main class="main" id="main">

    <!-- ============ ORDERS LIST ============ -->
    <section id="listView">
      <header class="topbar">
        <button class="icon-btn mobile-menu" type="button" data-act="menu" aria-label="Open menu">☰</button>
        <div class="topbar-title">
          <div class="eyebrow">ORDER OPERATIONS</div>
          <h1>Orders</h1>
          <p>One order system for WhatsApp, Instagram, website and manual entry.</p>
        </div>
        <button class="btn primary" type="button" data-act="create" id="createBtn">＋ Create Order</button>
      </header>

      <section class="stats" id="stats" aria-label="Order summary"></section>

      <section class="orders-shell">
        <div class="toolbar">
          <div class="tabs" id="tabs" role="tablist" aria-label="Order groups"></div>
          <div class="tools">
            <label class="search"><span class="sr-only">Search orders</span><input id="search" type="search" placeholder="Search order, customer, product…" autocomplete="off"></label>
            <button class="btn ghost" type="button" data-act="filters" id="filterBtn">⚙ Filters<span id="filterCount" class="count-dot" hidden></span></button>
          </div>
        </div>
        <div id="orderList" class="order-list" aria-live="polite"></div>
        <div class="more-wrap" id="moreWrap" hidden><button class="btn ghost" type="button" data-act="loadmore">Load more orders</button></div>
      </section>
    </section>

    <!-- ============ ORDER DETAIL ============ -->
    <section id="detailView" hidden></section>

  </main>
</div>

<div id="sheetRoot" hidden></div>
<div id="modalRoot" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="orders.js"></script>
</body>
</html>
