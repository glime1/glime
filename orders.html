<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080c">
<title>Orders | GLIME</title>
<link rel="icon" type="image/svg+xml" href="glime_logo_clean.svg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="orders.css">
<link rel="stylesheet" href="glime-app-shell.css">
<script src="glime-app-shell.js" defer></script>
</head>
<body data-gas-title="Orders">

<div id="boot" class="boot" role="status"><img src="glime_logo_clean.svg" alt="GLIME"><span>Securing your GLIME workspace…</span></div>

<main class="main" id="main" data-gas-content>

    <!-- ============ ORDERS LIST ============ -->
    <section id="listView">
      <header class="topbar">
        <div class="topbar-title">
          <div class="eyebrow">ORDER OPERATIONS</div>
          <h1>Orders</h1>
          <p>One order system for WhatsApp, Instagram, website and manual entry.</p>
        </div>
        <div class="topbar-actions">
          <button class="btn ghost" type="button" data-act="export" id="exportBtn">⬇ Export CSV</button>
          <button class="btn primary" type="button" data-act="create" id="createBtn">＋ Create Order</button>
        </div>
      </header>

      <section class="stats" id="stats" aria-label="Order summary"></section>

      <section class="orders-shell">
        <div class="toolbar">
          <div class="tabs" id="tabs" role="tablist" aria-label="Order groups"></div>
          <div class="tools">
            <label class="search"><span class="sr-only">Search orders</span><input id="search" type="search" placeholder="Search order, customer, product…" autocomplete="off"></label>
            <button class="btn ghost" type="button" data-act="filters" id="filterBtn">⚙ Filters<span id="filterCount" class="count-dot" hidden></span></button>
          </div>
        </div>
        <div id="orderList" class="order-list" aria-live="polite"></div>
        <div class="more-wrap" id="moreWrap" hidden><button class="btn ghost" type="button" data-act="loadmore">Load more orders</button></div>
      </section>
    </section>

    <!-- ============ ORDER DETAIL ============ -->
    <section id="detailView" hidden></section>

</main>

<div id="sheetRoot" hidden></div>
<div id="modalRoot" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="orders.js"></script>
</body>
</html>
